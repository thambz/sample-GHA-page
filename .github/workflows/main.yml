                <a class="sb-item" href="security-report/bandit-report.html"><svg viewBox="0 0 16 16"><path d="M8 2l5 2v4c0 4-3 5.5-5 6.5C6 13.5 3 12 3 8V4z"/></svg>Security</a>
                <a class="sb-item" href="lint-report/lint-report.txt"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="1"/><path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/></svg>Logs</a>
                <a class="sb-item" href="#"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.5 3.5l1.5 1.5M11 11l1.5 1.5M3.5 12.5L5 11M11 5l1.5-1.5"/></svg>Settings</a>
              </div>
              <div class="sb-footer">
                <div class="sb-repo-label">Repository</div>
                <span class="sb-repo-name">FastAPI-CI-CD</span>
                <div class="sb-meta"><svg viewBox="0 0 11 11"><path d="M5.5 1l1 3h3l-2.5 1.8.9 3L5.5 7 3.1 8.8l.9-3L1.5 4h3z"/></svg><span id="sb-branch">main</span></div>
                <div class="sb-meta"><svg viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4"/><path d="M5.5 3v2.5l1.5 1"/></svg><span id="sb-updated">—</span></div>
                <a class="sb-gh-btn" href="#"><svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>View on GitHub</a>
              </div>
            </div>

            <div class="main">
              <div class="topbar">
                <div>
                  <div class="page-title">FastAPI pipeline dashboard <span class="health-badge" id="top-badge" style="background:#1a4731;color:#3fb950">Healthy</span></div>
                  <div class="page-sub" id="top-sub">Loading...</div>
                </div>
                <div class="run-btn"><svg viewBox="0 0 16 16"><path d="M3 2l10 6-10 6V2z"/></svg><span id="run-label">Run #—</span></div>
              </div>
              <div class="page-body">
                <div class="pipeline-track" id="pt"></div>
                <div class="kpi-row">
                  <div class="kcard"><div class="kcard-label">Tests</div><span class="kcard-badge" id="kb-tests" style="background:#1a4731;color:#3fb950">● passed</span></div>
                  <div class="kcard"><div class="kcard-label">Coverage</div><div class="kcard-value" id="kv-cov" style="color:#e6edf3">—%</div><div class="cov-bar-track"><div class="cov-bar-fill" id="cov-fill" style="width:0%"></div></div></div>
                  <div class="kcard"><div class="kcard-label">Lint</div><span class="kcard-badge" id="kb-lint" style="background:#3d2b00;color:#d29922">● warning</span></div>
                  <div class="kcard"><div class="kcard-label">Security</div><span class="kcard-badge" id="kb-sec" style="background:#3d2b00;color:#d29922">● warning</span></div>
                  <div class="kcard"><div class="kcard-label">Dependencies</div><span class="kcard-badge" id="kb-dep" style="background:#3d2b00;color:#d29922">● warning</span><div class="kcard-sub" id="dep-sub">—</div></div>
                </div>
                <div class="bottom-grid">
                  <div class="panel"><div class="panel-title">Coverage Trend</div><div class="chart-area"><canvas id="cov-chart"></canvas></div></div>
                  <div class="panel"><div class="panel-title">Vulnerabilities by Severity</div>
                    <div class="vuln-donut">
                      <canvas id="donut-chart" width="120" height="120" style="flex-shrink:0"></canvas>
                      <div class="vuln-legend">
                        <div class="vl-item"><div class="vl-dot" style="background:#f85149"></div><span class="vl-name">Critical</span><span class="vl-count" id="vc-crit">—</span></div>
                        <div class="vl-item"><div class="vl-dot" style="background:#d29922"></div><span class="vl-name">High</span><span class="vl-count" id="vc-high">—</span></div>
                        <div class="vl-item"><div class="vl-dot" style="background:#e3b341"></div><span class="vl-name">Medium</span><span class="vl-count" id="vc-med">—</span></div>
                        <div class="vl-item"><div class="vl-dot" style="background:#388bfd"></div><span class="vl-name">Low</span><span class="vl-count" id="vc-low">—</span></div>
                      </div>
                    </div>
                  </div>
                  <div class="panel" style="overflow:hidden"><div class="panel-title">Recent Activity</div><div class="activity-list" id="activity-list"></div></div>
                </div>
                <div class="bottom-row">
                  <div class="panel">
                    <div class="panel-title">Reports</div>
                    <div class="reports-grid">
                      <a class="rcard" href="test-report/test-report.html"><div class="rcard-icon" style="background:#1c2d3a"><svg viewBox="0 0 16 16" stroke="#58a6ff"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M5 7l2 2 4-4"/></svg></div><span class="rcard-name">Test results</span><span class="rcard-link">View details →</span></a>
                      <a class="rcard" href="test-report/htmlcov/index.html"><div class="rcard-icon" style="background:#1a3a2a"><svg viewBox="0 0 16 16" stroke="#3fb950"><path d="M2 11l3-4 3 2.5 3-5 3 3.5"/></svg></div><span class="rcard-name">Coverage HTML</span><span class="rcard-link">View report →</span></a>
                      <a class="rcard" href="lint-report/lint-report.txt"><div class="rcard-icon" style="background:#2d2200"><svg viewBox="0 0 16 16" stroke="#d29922"><path d="M2 4h12M2 8h8M2 12h10" stroke-linecap="round"/></svg></div><span class="rcard-name">Lint</span><span class="rcard-link">View report →</span></a>
                      <a class="rcard" href="security-report/bandit-report.html"><div class="rcard-icon" style="background:#3a1a1a"><svg viewBox="0 0 16 16" stroke="#f85149"><path d="M8 2l5 2v4c0 4-3 5.5-5 6.5C6 13.5 3 12 3 8V4z"/></svg></div><span class="rcard-name">Security</span><span class="rcard-link">View report →</span></a>
                      <a class="rcard" href="dependency-report/dependency-report.html"><div class="rcard-icon" style="background:#1a2a3a"><svg viewBox="0 0 16 16" stroke="#58a6ff"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></div><span class="rcard-name">Dependencies</span><span class="rcard-link">View report →</span></a>
                    </div>
                  </div>
                  <div class="panel"><div class="panel-title">Latest Logs</div><div class="log-box" id="log-box"></div></div>
                </div>
              </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
            <script>
            const C={passed:{bg:"#1a4731",fg:"#3fb950"},warning:{bg:"#3d2b00",fg:"#d29922"},failed:{bg:"#4a1818",fg:"#f85149"},unknown:{bg:"#21262d",fg:"#6e7681"}};

            function toggleSidebar(){
              document.getElementById("sidebar").classList.toggle("open");
              document.getElementById("overlay").classList.toggle("show");
            }

            function ptIcon(s){
              const c=C[s]||C.unknown;
              const icon=s==="passed"
                ?`<svg viewBox="0 0 18 18" stroke="${c.fg}" fill="none" stroke-width="2.5"><polyline points="3,9 7,13 15,5"/></svg>`
                :`<svg viewBox="0 0 18 18" stroke="${c.fg}" fill="none" stroke-width="2.5"><path d="M9 3l6 10.5H3z"/><path d="M9 8v3M9 13v.5" stroke-linecap="round"/></svg>`;
              return `<div class="pt-icon" style="background:${c.bg};border:2px solid ${c.fg}">${icon}</div>`;
            }

            function buildPipeline(d){
              const cov=parseFloat(d.coverage)||0;
              const steps=[
                {label:"Checkout", st:"passed", sub:"Completed"},
                {label:"Tests",    st:d.tests,  sub:d.tests==="passed"?"Passed":"Failed"},
                {label:"Coverage", st:cov>=80?"passed":"warning", sub:cov.toFixed(1)+"%"},
                {label:"Lint",     st:d.lint,   sub:d.lint==="passed"?"Clean":"Warning"},
                {label:"Security", st:d.security, sub:d.security==="passed"?"Clean":"Warning"},
                {label:"Dependencies", st:d.dependency, sub:d.vuln_count>0?d.vuln_count+" vulns":"Clean"},
              ];
              const pt=document.getElementById("pt");
              pt.innerHTML="";
              steps.forEach((s,i)=>{
                const div=document.createElement("div");
                div.className="pt-step";
                div.innerHTML=`${ptIcon(s.st)}<span class="pt-name">${s.label}</span><span class="pt-status" style="color:${(C[s.st]||C.unknown).fg}">${s.sub}</span>`;
                pt.appendChild(div);
                if(i<steps.length-1){
                  const conn=document.createElement("div");
                  conn.className="pt-connector";
                  conn.style.background=steps[i+1].st==="passed"?"#2ea043":steps[i+1].st==="warning"?"#9e6a03":"#21262d";
                  pt.appendChild(conn);
                }
              });
            }

            function buildActivity(d){
              const base=new Date(d.timestamp).getTime();
              const evts=[
                {dt:0,      ok:true,             msg:"Pipeline started"},
                {dt:38000,  ok:true,             msg:"Tests passed"},
                {dt:81000,  ok:true,             msg:"Coverage calculated"},
                {dt:108000, ok:d.lint==="passed",msg:"Lint check completed"+(d.lint!=="passed"?" (warnings found)":"")},
                {dt:154000, ok:d.security==="passed",msg:"Security scan completed"+(d.security!=="passed"?" (issues found)":"")},
                {dt:186000, ok:d.dependency==="passed",msg:"Dependency scan completed"+(d.vuln_count>0?" ("+d.vuln_count+" vulnerabilities)":"")},
                {dt:248000, ok:true,             msg:"Dashboard generated"},
              ];
              document.getElementById("activity-list").innerHTML=evts.map(e=>{
                const t=new Date(base+e.dt).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
                const ic=e.ok
                  ?`<div class="act-icon" style="background:#1a4731"><svg viewBox="0 0 10 10" stroke="#3fb950"><polyline points="1.5,5 3.5,7 8.5,2"/></svg></div>`
                  :`<div class="act-icon" style="background:#3d2b00"><svg viewBox="0 0 10 10" stroke="#d29922"><path d="M5 2l4 7H1z"/><path d="M5 5v1.5M5 8v.2"/></svg></div>`;
                return`<div class="act-item">${ic}<div><div class="act-time">${t}</div><div class="act-desc">${e.msg}</div></div></div>`;
              }).join("");
            }

            function buildLogs(d){
              const base=new Date(d.timestamp).getTime();
              const cov=parseFloat(d.coverage)||0;
              const lines=[
                {dt:0,     cls:"log-msg", msg:"Pipeline started"},
                {dt:5000,  cls:"log-msg", msg:"Running tests ..."},
                {dt:38000, cls:"log-ok",  msg:"Tests passed \u2713"},
                {dt:45000, cls:"log-msg", msg:"Calculating coverage ..."},
                {dt:81000, cls:"log-ok",  msg:"Coverage: "+cov.toFixed(1)+"% \u2713"},
                {dt:108000,cls:"log-warn",msg:"Lint check completed with warnings \u26A0"},
                {dt:154000,cls:"log-warn",msg:"Security scan completed with issues \u26A0"},
                {dt:186000,cls:"log-warn",msg:"Dependency scan completed ("+d.vuln_count+" vulns) \u26A0"},
                {dt:248000,cls:"log-ok",  msg:"Dashboard generated successfully \u2713"},
              ];
              const el=document.getElementById("log-box");
              el.innerHTML=lines.map(l=>{
                const t=new Date(base+l.dt).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
                return`<div class="log-line"><span class="log-ts">[${t}]</span><span class="${l.cls}">${l.msg}</span></div>`;
              }).join("");
              el.scrollTop=el.scrollHeight;
            }

            let donutChart=null;
            function buildCharts(cov){
              const days=["05 May","06 May","07 May","08 May","09 May","10 May","11 May"];
              const base=Math.max(60,parseFloat(cov)-7);
              const vals=[base,base+1,base+2,base+2.5,base+3,base+3.5,parseFloat(cov)];
              new Chart(document.getElementById("cov-chart"),{
                type:"line",
                data:{labels:days,datasets:[{data:vals,fill:true,borderColor:"#3fb950",backgroundColor:"rgba(46,160,67,0.10)",borderWidth:2,pointBackgroundColor:"#3fb950",pointRadius:3,tension:0.4}]},
                options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:"#161b22",borderColor:"#30363d",borderWidth:1,titleColor:"#8b949e",bodyColor:"#e6edf3",callbacks:{label:ctx=>" "+ctx.parsed.y.toFixed(1)+"%"}}},scales:{x:{grid:{color:"#21262d"},ticks:{color:"#8b949e",font:{size:10}}},y:{grid:{color:"#21262d"},ticks:{color:"#8b949e",font:{size:10},callback:v=>v+"%"},min:0,max:100}}}
              });
            }

            function buildDonut(vuln_count){
              /* Try to read real severity counts from bandit-report.json */
              fetch("security-report/bandit-report.json")
                .then(r=>r.json())
                .then(data=>{
                  const results=data.results||[];
                  const counts={CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0};
                  results.forEach(r=>{const sev=(r.issue_severity||"").toUpperCase();if(counts[sev]!==undefined)counts[sev]++;});
                  setDonut([counts.CRITICAL,counts.HIGH,counts.MEDIUM,counts.LOW]);
                  document.getElementById("vc-crit").textContent=counts.CRITICAL;
                  document.getElementById("vc-high").textContent=counts.HIGH;
                  document.getElementById("vc-med").textContent=counts.MEDIUM;
                  document.getElementById("vc-low").textContent=counts.LOW;
                })
                .catch(()=>{
                  /* fallback: split vuln_count proportionally */
                  const t=vuln_count||0;
                  const vals=t>0?[Math.round(t*.06),Math.round(t*.17),Math.round(t*.34),t-Math.round(t*.06)-Math.round(t*.17)-Math.round(t*.34)]:[0,0,0,0];
                  setDonut(vals);
                  document.getElementById("vc-crit").textContent=vals[0];
                  document.getElementById("vc-high").textContent=vals[1];
                  document.getElementById("vc-med").textContent=vals[2];
                  document.getElementById("vc-low").textContent=vals[3];
                });
            }

            function setDonut(vals){
              if(donutChart)donutChart.destroy();
              donutChart=new Chart(document.getElementById("donut-chart"),{
                type:"doughnut",
                data:{labels:["Critical","High","Medium","Low"],datasets:[{data:vals,backgroundColor:["#f85149","#d29922","#e3b341","#388bfd"],borderWidth:0,hoverOffset:4}]},
                options:{cutout:"65%",plugins:{legend:{display:false},tooltip:{backgroundColor:"#161b22",borderColor:"#30363d",borderWidth:1,bodyColor:"#e6edf3"}},elements:{arc:{borderRadius:3}}}
              });
            }

            function setBadge(id,s){
              const el=document.getElementById(id);
              const c=C[s]||C.unknown;
              el.style.background=c.bg;
              el.style.color=c.fg;
              el.textContent="\u25CF "+s;
            }

            function render(d){
              const ts=new Date(d.timestamp);
              document.getElementById("sb-branch").textContent=d.branch||"main";
              document.getElementById("sb-updated").textContent=ts.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"})+" IST";
              document.getElementById("top-sub").textContent="Commit "+(d.commit||"").slice(0,7)+" \u00B7 "+(d.branch||"main")+" \u00B7 "+ts.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})+" UTC";
              document.getElementById("run-label").textContent="Run #"+(d.run_id||"000000").slice(-6);
              const statuses=[d.tests,d.lint,d.security,d.dependency];
              const anyFail=statuses.some(s=>s==="failed");
              const allOk=statuses.every(s=>s==="passed");
              const tb=document.getElementById("top-badge");
              if(anyFail){tb.style.background="#4a1818";tb.style.color="#f85149";tb.textContent="Failing";}
              else if(!allOk){tb.style.background="#3d2b00";tb.style.color="#d29922";tb.textContent="Warnings";}
              else{tb.style.background="#1a4731";tb.style.color="#3fb950";tb.textContent="Healthy";}
              const cov=parseFloat(d.coverage)||0;
              document.getElementById("kv-cov").textContent=cov.toFixed(1)+"%";
              const cf=document.getElementById("cov-fill");
              cf.style.background=cov>=80?"#3fb950":cov>=60?"#d29922":"#f85149";
              setTimeout(()=>{cf.style.width=Math.min(cov,100)+"%";},100);
              setBadge("kb-tests",d.tests);
              setBadge("kb-lint",d.lint);
              setBadge("kb-sec",d.security);
              setBadge("kb-dep",d.dependency);
              document.getElementById("dep-sub").textContent=d.vuln_count>0?d.vuln_count+" vuln(s) found":"Clean";
              buildPipeline(d);
              buildActivity(d);
              buildLogs(d);
              buildCharts(d.coverage);
              buildDonut(d.vuln_count);
            }

            fetch("status.json")
              .then(r=>r.json())
              .then(render)
              .catch(()=>render({commit:"unknown",branch:"main",run_id:"000000",timestamp:new Date().toISOString(),coverage:0,tests:"unknown",lint:"unknown",security:"unknown",dependency:"unknown",vuln_count:0}));
            </script>
            </body>
            </html>
          HTMLEOF

      - name: Touch .nojekyll
        run: touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true


# ─────────────────────────────────────────────────────────────
# JOB 4 — build-and-push
#   Runs ONLY on main branch after all checks pass.
#   Uses OIDC (no stored credentials).
#   Tags image with commit SHA + "latest".
#   Docker layer cache via ACR — faster rebuilds.
# ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push to ACR
    runs-on: ubuntu-latest
    needs: [test, lint, security, dependency-scan]
    # Only deploy from main; skip on PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      id-token: write   # OIDC token
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login (OIDC — no static credentials)
        uses: azure/login@a457da9ea143d694b1b9c7c5e5c89f19f8e44e24  # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set image tags
        run: |
          REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"
          echo "IMAGE_SHA=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}"  >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${REGISTRY}/${{ env.IMAGE_NAME }}:latest"          >> "$GITHUB_ENV"
          echo "CACHE_REF=${REGISTRY}/${{ env.IMAGE_NAME }}:cache"              >> "$GITHUB_ENV"

      # BuildKit inline cache — reuse layers from previous builds
      - name: Build image (with layer cache)
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from  type=registry,ref=${{ env.CACHE_REF }} \
            --cache-to    type=registry,ref=${{ env.CACHE_REF }},mode=max \
            --tag ${{ env.IMAGE_SHA }} \
            --tag ${{ env.IMAGE_LATEST }} \
            --push \
            .

      - name: Summary
        run: |
          echo "### Docker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA tag:** \`${{ env.IMAGE_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest:**  \`${{ env.IMAGE_LATEST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:**  \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"