          <div class="main">
            <div class="topbar">
              <div>
                <div class="page-title">FastAPI pipeline dashboard<span class="health-badge" id="top-badge" style="background:#1a4731;color:#3fb950">Healthy</span></div>
                <div class="page-sub" id="top-sub">Loading...</div>
              </div>
              <div class="run-btn"><svg viewBox="0 0 16 16"><path d="M3 2l10 6-10 6V2z"/></svg><span id="run-label">Run #—</span></div>
            </div>
            <div class="page-body">
              <div id="sec-banner" style="display:none;background:#2d0f0f;border:1px solid #f85149;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:none"><div style="display:flex;align-items:flex-start;gap:12px"><div style="width:32px;height:32px;border-radius:8px;background:#4a1818;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#f85149" stroke-width="2"><path d="M8 2l5 2v4c0 4-3 5.5-5 6.5C6 13.5 3 12 3 8V4z"/><path d="M8 6v3M8 11v.5" stroke-linecap="round"/></svg></div><div style="flex:1"><p style="font-size:13px;font-weight:600;color:#f85149;margin-bottom:4px">🚨 Critical Security Issues Detected — Pipeline Blocked</p><p style="font-size:12px;color:#e6edf3;margin-bottom:8px" id="banner-desc">—</p><div style="background:#1a0a0a;border-radius:6px;padding:10px 12px;font-size:11px;color:#fca5a5;font-family:monospace;line-height:1.8" id="banner-issues"></div><p style="font-size:11px;color:#8b949e;margin-top:8px">💡 Fix: Use <code style="background:#21262d;padding:1px 5px;border-radius:3px;color:#e6edf3">os.environ.get("SECRET_KEY")</code> instead of hardcoding secrets. Store credentials in GitHub Secrets → pass as env vars.</p></div></div></div><div class="pipeline-track" id="pt"></div>
              <div class="kpi-row">
