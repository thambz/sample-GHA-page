            color:#cbd5e1;
          }

          /* METRICS */

          .metrics{

            margin-top:18px;

            display:grid;

            grid-template-columns:
            repeat(4,1fr);

            gap:14px;
          }

          .metric-card{

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:18px;

            padding:18px;
          }

          .metric-label{

