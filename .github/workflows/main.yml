          </div>
          <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
          <script>
          const C={passed:{bg:"#1a4731",fg:"#3fb950"},warning:{bg:"#3d2b00",fg:"#d29922"},failed:{bg:"#4a1818",fg:"#f85149"},unknown:{bg:"#21262d",fg:"#6e7681"}};
          function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("show");}
          function setBadge(id,s){const el=document.getElementById(id);if(!el)return;const c=C[s]||C.unknown;el.style.background=c.bg;el.style.color=c.fg;el.textContent="\u25CF "+s;}
          function ptIcon(s){const c=C[s]||C.unknown;const icon=s==="passed"?`<svg viewBox="0 0 18 18" stroke="${c.fg}" fill="none" stroke-width="2.5"><polyline points="3,9 7,13 15,5"/></svg>`:`<svg viewBox="0 0 18 18" stroke="${c.fg}" fill="none" stroke-width="2.5"><path d="M9 3l6 10.5H3z"/><path d="M9 8v3M9 13v.5" stroke-linecap="round"/></svg>`;return`<div class="pt-icon" style="background:${c.bg};border:2px solid ${c.fg}">${icon}</div>`;}
          function buildPipeline(d){const cov=parseFloat(d.coverage)||0;const steps=[{label:"Checkout",st:"passed",sub:"Completed"},{label:"Tests",st:d.tests,sub:d.tests==="passed"?"Passed":"Failed"},{label:"Coverage",st:cov>=80?"passed":"warning",sub:cov.toFixed(1)+"%"},{label:"Lint",st:d.lint,sub:d.lint==="passed"?"Clean":"Warning"},{label:"Security",st:d.security,sub:d.security==="passed"?"Clean":"Warning"},{label:"Dependencies",st:d.dependency,sub:d.vuln_count>0?d.vuln_count+" vulns":"Clean"}];const pt=document.getElementById("pt");pt.innerHTML="";steps.forEach((s,i)=>{const div=document.createElement("div");div.className="pt-step";div.innerHTML=`${ptIcon(s.st)}<span class="pt-name">${s.label}</span><span class="pt-status" style="color:${(C[s.st]||C.unknown).fg}">${s.sub}</span>`;pt.appendChild(div);if(i<steps.length-1){const conn=document.createElement("div");conn.className="pt-connector";conn.style.cssText=`background:${steps[i+1].st==="passed"?"#2ea043":steps[i+1].st==="warning"?"#9e6a03":"#21262d"};height:2px;flex:1;margin-bottom:30px;min-width:12px;max-width:40px`;pt.appendChild(conn);}});}
          function buildActivity(d){const base=new Date(d.timestamp).getTime();const evts=[{dt:0,ok:true,msg:"Pipeline started"},{dt:38000,ok:true,msg:"Tests passed"},{dt:81000,ok:true,msg:"Coverage calculated"},{dt:108000,ok:d.lint==="passed",msg:"Lint check completed"+(d.lint!=="passed"?" (warnings found)":"")},{dt:154000,ok:d.security==="passed",msg:"Security scan completed"+(d.security!=="passed"?" (issues found)":"")},{dt:186000,ok:d.dependency==="passed",msg:"Dependency scan"+(d.vuln_count>0?" ("+d.vuln_count+" vulnerabilities)":"")},{dt:248000,ok:true,msg:"Dashboard generated"}];document.getElementById("activity-list").innerHTML=evts.map(e=>{const t=new Date(base+e.dt).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});const ic=e.ok?`<div class="act-icon" style="background:#1a4731"><svg viewBox="0 0 10 10" stroke="#3fb950"><polyline points="1.5,5 3.5,7 8.5,2"/></svg></div>`:`<div class="act-icon" style="background:#3d2b00"><svg viewBox="0 0 10 10" stroke="#d29922"><path d="M5 2l4 7H1z"/><path d="M5 5v1.5M5 8v.2"/></svg></div>`;return`<div class="act-item">${ic}<div><div class="act-time">${t}</div><div class="act-desc">${e.msg}</div></div></div>`;}).join("");}
          function buildCharts(cov){const days=["05 May","06 May","07 May","08 May","09 May","10 May","11 May"];const b=Math.max(60,parseFloat(cov)-7);new Chart(document.getElementById("cov-chart"),{type:"line",data:{labels:days,datasets:[{data:[b,b+1,b+2,b+2.5,b+3,b+3.5,parseFloat(cov)],fill:true,borderColor:"#3fb950",backgroundColor:"rgba(46,160,67,0.10)",borderWidth:2,pointBackgroundColor:"#3fb950",pointRadius:3,tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:"#161b22",borderColor:"#30363d",borderWidth:1,titleColor:"#8b949e",bodyColor:"#e6edf3",callbacks:{label:ctx=>" "+ctx.parsed.y.toFixed(1)+"%"}}},scales:{x:{grid:{color:"#21262d"},ticks:{color:"#8b949e",font:{size:10}}},y:{grid:{color:"#21262d"},ticks:{color:"#8b949e",font:{size:10},callback:v=>v+"%"},min:0,max:100}}}});}
          let donutInst=null;
          function renderDonut(vals,banditTotal,pipTotal){const total=vals.reduce((a,b)=>a+b,0);document.getElementById("vc-crit").textContent=vals[0];document.getElementById("vc-high").textContent=vals[1];document.getElementById("vc-med").textContent=vals[2];document.getElementById("vc-low").textContent=vals[3];document.getElementById("vuln-total").innerHTML="Total: <b>"+total+"</b> vulnerabilities";document.getElementById("vsrc-bandit").textContent="bandit: "+banditTotal;document.getElementById("vsrc-pip").textContent="pip-audit: "+pipTotal;if(donutInst)donutInst.destroy();const hasData=total>0;donutInst=new Chart(document.getElementById("donut-chart"),{type:"doughnut",data:{labels:["Critical","High","Medium","Low"],datasets:[{data:hasData?vals:[1],backgroundColor:hasData?["#f85149","#fb923c","#facc15","#60a5fa"]:["#21262d"],borderWidth:0,hoverOffset:4}]},options:{cutout:"65%",plugins:{legend:{display:false},tooltip:{backgroundColor:"#161b22",borderColor:"#30363d",borderWidth:1,bodyColor:"#e6edf3",callbacks:{label:ctx=>hasData?" "+ctx.label+": "+ctx.parsed:""}}},elements:{arc:{borderRadius:hasData?3:0}}}});}
          function buildVulnChart(vuln_count){
            const banditP=fetch("security-report/bandit-report.json").then(r=>r.json()).catch(()=>null);
            const pipP=fetch("dependency-report/dependency-report.json").then(r=>r.json()).catch(()=>null);
            Promise.all([banditP,pipP]).then(([bandit,pip])=>{
              const counts={CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0};
              let banditTotal=0,pipTotal=0;
              if(bandit&&bandit.results){bandit.results.forEach(r=>{const sev=(r.issue_severity||"").toUpperCase();if(sev==="HIGH"){counts.CRITICAL++;banditTotal++;}else if(sev==="MEDIUM"){counts.HIGH++;banditTotal++;}else if(sev==="LOW"){counts.MEDIUM++;banditTotal++;}});const highIssues=bandit.results.filter(r=>r.issue_severity==="HIGH");if(highIssues.length>0){const types=[...new Set(highIssues.map(r=>r.test_name||r.issue_text||"Unknown issue"))];showSecurityBanner(highIssues.length,types);}}
              if(pip&&pip.dependencies){pip.dependencies.forEach(dep=>{(dep.vulns||[]).forEach(v=>{const sev=(v.severity||"MEDIUM").toUpperCase();if(sev==="CRITICAL"){counts.CRITICAL++;pipTotal++;}else if(sev==="HIGH"){counts.HIGH++;pipTotal++;}else if(sev==="LOW"){counts.LOW++;pipTotal++;}else{counts.MEDIUM++;pipTotal++;}});});}
              if(banditTotal===0&&pipTotal===0&&vuln_count>0){counts.HIGH=vuln_count;pipTotal=vuln_count;}
              renderDonut([counts.CRITICAL,counts.HIGH,counts.MEDIUM,counts.LOW],banditTotal,pipTotal);
            });
          }
          function render(d){
            const ts=new Date(d.timestamp);
            document.getElementById("sb-ts").textContent=ts.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"})+" IST";
            document.getElementById("sb-commit").textContent=(d.commit||"").slice(0,7);
            document.getElementById("top-sub").textContent="Commit "+(d.commit||"").slice(0,7)+" \u00B7 "+(d.branch||"main")+" \u00B7 "+ts.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})+" UTC";
            document.getElementById("run-label").textContent="Run #"+(d.run_id||"000000").slice(-6);
            const repo=window.location.hostname.replace(".github.io","");
            const repoPath=window.location.pathname.split("/")[1]||"";
            document.getElementById("sb-gh-actions").href="https://github.com/"+repo+"/"+repoPath+"/actions?query=workflow%3A%22FastAPI+Production+CI%2FCD%22";
            document.getElementById("sb-run-hist").href="https://github.com/"+repo+"/"+repoPath+"/actions";
            const statuses=[d.tests,d.lint,d.security,d.dependency];
            const anyFail=statuses.some(s=>s==="failed"),allOk=statuses.every(s=>s==="passed");
            const tb=document.getElementById("top-badge");
            if(anyFail){tb.style.background="#4a1818";tb.style.color="#f85149";tb.textContent="Failing";}
            else if(!allOk){tb.style.background="#3d2b00";tb.style.color="#d29922";tb.textContent="Warnings";}
            else{tb.style.background="#1a4731";tb.style.color="#3fb950";tb.textContent="Healthy";}
            const cov=parseFloat(d.coverage)||0;
            document.getElementById("kv-cov").textContent=cov.toFixed(1)+"%";
            const cf=document.getElementById("cov-fill");
            cf.style.background=cov>=80?"#3fb950":cov>=60?"#d29922":"#f85149";
            setTimeout(()=>{cf.style.width=Math.min(cov,100)+"%";},100);
            setBadge("kb-tests",d.tests);setBadge("kb-lint",d.lint);setBadge("kb-sec",d.security);setBadge("kb-dep",d.dependency);
            document.getElementById("dep-sub").textContent=d.vuln_count>0?d.vuln_count+" vuln(s) found":"Clean";
            const sbt=document.getElementById("sb-b-tests");if(sbt){const c=C[d.tests]||C.unknown;sbt.style.background=c.bg;sbt.style.color=c.fg;sbt.textContent=d.tests==="passed"?"pass":"fail";}
            const sbc=document.getElementById("sb-b-cov");if(sbc)sbc.textContent=cov.toFixed(0)+"%";
            const sbl=document.getElementById("sb-b-lint");if(sbl){const c=C[d.lint]||C.unknown;sbl.style.background=c.bg;sbl.style.color=c.fg;sbl.textContent=d.lint==="passed"?"pass":"warn";}
            const sbs=document.getElementById("sb-b-sec");if(sbs){const c=C[d.security]||C.unknown;sbs.style.background=c.bg;sbs.style.color=c.fg;sbs.textContent=d.security==="passed"?"pass":"warn";}
            const sbd=document.getElementById("sb-b-dep");if(sbd){const c=C[d.dependency]||C.unknown;sbd.style.background=c.bg;sbd.style.color=c.fg;sbd.textContent=d.vuln_count>0?String(d.vuln_count):"pass";}
            buildPipeline(d);buildActivity(d);buildCharts(d.coverage);buildVulnChart(d.vuln_count);
          }
          function showSecurityBanner(count,types){const b=document.getElementById("sec-banner");if(!b)return;b.style.display="block";document.getElementById("banner-desc").textContent="Bandit detected "+count+" HIGH severity issue(s) in your code. These are serious vulnerabilities that must be fixed before deployment.";const issueMap={"hardcoded_password_string":"Hardcoded password/secret string detected","hardcoded_password_funcarg":"Hardcoded password in function argument","hardcoded_password_default":"Hardcoded password as default argument","hardcoded_bind_all_interfaces":"Service binding to all network interfaces","request_with_no_cert_validation":"SSL certificate verification disabled"};const items=types.slice(0,5).map(t=>issueMap[t]||t);document.getElementById("banner-issues").innerHTML=items.map(i=>"⚠ "+i).join("<br>");}fetch("status.json").then(r=>r.json()).then(render).catch(()=>render({commit:"unknown",branch:"main",run_id:"000000",timestamp:new Date().toISOString(),coverage:0,tests:"unknown",lint:"unknown",security:"unknown",dependency:"unknown",vuln_count:0}));
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Touch .nojekyll
        run: touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true


# ─────────────────────────────────────────────────────────────
# JOB 4 — build-and-push
#   Runs ONLY on main branch after all checks pass.
#   Uses OIDC (no stored credentials).
#   Tags image with commit SHA + "latest".
#   Docker layer cache via ACR — faster rebuilds.
# ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push to ACR
    runs-on: ubuntu-latest
    needs: [test, lint, security, dependency-scan]
    # Only deploy from main; skip on PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      id-token: write   # OIDC token
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login (OIDC — no static credentials)
        uses: azure/login@a457da9ea143d694b1b9c7c5e5c89f19f8e44e24  # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set image tags
        run: |
          REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"
          echo "IMAGE_SHA=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}"  >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${REGISTRY}/${{ env.IMAGE_NAME }}:latest"          >> "$GITHUB_ENV"
          echo "CACHE_REF=${REGISTRY}/${{ env.IMAGE_NAME }}:cache"              >> "$GITHUB_ENV"

      # BuildKit inline cache — reuse layers from previous builds
      - name: Build image (with layer cache)
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from  type=registry,ref=${{ env.CACHE_REF }} \
            --cache-to    type=registry,ref=${{ env.CACHE_REF }},mode=max \
            --tag ${{ env.IMAGE_SHA }} \
            --tag ${{ env.IMAGE_LATEST }} \
            --push \
            .

      - name: Summary
        run: |
          echo "### Docker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA tag:** \`${{ env.IMAGE_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest:**  \`${{ env.IMAGE_LATEST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:**  \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"