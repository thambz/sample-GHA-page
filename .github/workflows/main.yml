# ============================================================
#  FastAPI — Production CI/CD Pipeline
#  Target: Azure Container Registry (ACR)
#
#  SECRETS needed in GitHub → Settings → Secrets:
#    AZURE_CLIENT_ID        (OIDC federated credential)
#    AZURE_TENANT_ID
#    AZURE_SUBSCRIPTION_ID
#    ACR_NAME               (e.g. "myregistry" — no .azurecr.io)
#
#  HOW TO SET UP OIDC (no static keys):
#    az ad app create --display-name "github-actions-oidc"
#    az ad sp create --id <app-id>
#    az role assignment create --role AcrPush \
#      --assignee <sp-object-id> \
#      --scope /subscriptions/.../resourceGroups/.../providers/Microsoft.ContainerRegistry/registries/<ACR_NAME>
#    Add federated credential: issuer=https://token.actions.githubusercontent.com
#      subject=repo:<org>/<repo>:ref:refs/heads/main
# ============================================================

name: FastAPI Production CI/CD

# ── Triggers ─────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── Global env ───────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: fastapi-app
  # Full image name built dynamically in build job

# ── Concurrency: cancel in-flight runs on same branch/PR ─────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================
jobs:

# ─────────────────────────────────────────────────────────────
# JOB 1 — test
#   Runs pytest with coverage. Fails pipeline if < 80%.
#   Uploads HTML + XML reports as artifact.
# ─────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}   # e.g. "87.45"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |
          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      # Extract coverage % and expose as job output
      - name: Extract coverage percentage
        id: coverage
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os
          root = ET.parse("reports/coverage.xml").getroot()
          pct = round(float(root.attrib.get("line-rate", 0)) * 100, 2)
          print(f"Coverage: {pct}%")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pct={pct}\n")
          EOF

      - name: Upload test reports
        if: always()                          # upload even on test failure
        uses: actions/upload-artifact@v4  # v4.6.0
        with:
          name: test-reports
          path: reports/
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 2a — lint   (parallel with security + deps after test)
#   Uses ruff — 10-100x faster than flake8.
#   WARNING on violations; does NOT fail the pipeline.
#   Fails only if ruff itself crashes (config error, etc.).
# ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}   # "passed" | "warning"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        id: run
        run: |
          # --output-format=github → inline PR annotations
          if ruff check . --output-format=github --line-length 120; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Lint issues found — see annotations above"
          fi

          # Also generate a text report for the dashboard
          ruff check . --line-length 120 --output-format=text > reports/lint-report.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: reports/lint-report.txt
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 2b — security   (parallel with lint + deps after test)
#   bandit scans for Python security issues.
#   HIGH severity issues → fail the pipeline (blocks deploy).
#   MEDIUM/LOW → warning only.
# ─────────────────────────────────────────────────────────────
  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        id: run
        run: |
          mkdir -p reports

          # Full report for artifact
          bandit -r app/ -f json -o reports/bandit-report.json || true
          bandit -r app/ -f html -o reports/bandit-report.html || true

          # Fail pipeline on HIGH severity issues; warn on others
          HIGH=$(python - <<'EOF'
          import json, sys
          data = json.load(open("reports/bandit-report.json"))
          high = [i for i in data.get("results", []) if i.get("issue_severity") == "HIGH"]
          print(len(high))
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::$HIGH HIGH-severity security issue(s) found. Pipeline blocked."
            exit 1
          fi

          TOTAL=$(python -c "import json; d=json.load(open('reports/bandit-report.json')); print(len(d.get('results', [])))")
          if [ "$TOTAL" -gt "0" ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::$TOTAL medium/low security issue(s). Review bandit report."
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/bandit-report.*
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 2c — dependency-scan   (parallel with lint + security)
#   pip-audit checks for known CVEs in requirements.txt.
#   Any vulnerability → warning (not a hard fail by default).
#   Change exit 0 → exit 1 below to make it a hard fail.
# ─────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        id: run
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/dependency-report.json || true

          python - <<'EOF'
          import json, os, urllib.request, time

          data = json.load(open("reports/dependency-report.json"))

          def fetch_severity(vuln_id):
              try:
                  url = "https://api.osv.dev/v1/vulns/" + vuln_id
                  req = urllib.request.Request(url, headers={"Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=5) as r:
                      d = json.loads(r.read())
                  for sev in d.get("severity", []):
                      score = sev.get("score", "")
                      if score:
                          try:
                              s = float(score)
                              if s >= 9.0: return "CRITICAL"
                              if s >= 7.0: return "HIGH"
                              if s >= 4.0: return "MEDIUM"
                              return "LOW"
                          except: pass
                  db = d.get("database_specific", {})
                  sev_str = db.get("severity", "").upper()
                  if sev_str in ("CRITICAL","HIGH","MEDIUM","LOW"):
                      return sev_str
              except: pass
              return "MEDIUM"

          vulns_total = 0
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  vulns_total += 1
                  if not v.get("severity"):
                      v["severity"] = fetch_severity(v.get("id", ""))
                      time.sleep(0.1)

          with open("reports/dependency-report.json", "w") as f:
              json.dump(data, f)

          status = "passed" if vulns_total == 0 else "warning"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("status=" + status + "\n")
              f.write("vuln_count=" + str(vulns_total) + "\n")

          if vulns_total > 0:
              print("::warning::" + str(vulns_total) + " vulnerable dependency/dependencies found.")

          sev_color = {"CRITICAL":"#f85149","HIGH":"#fb923c","MEDIUM":"#facc15","LOW":"#60a5fa"}
          rows = ""
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  sev = v.get("severity","MEDIUM").upper()
                  color = sev_color.get(sev, "#8b949e")
                  rows += "<tr><td>" + str(dep.get("name","")) + "</td><td>" + str(dep.get("version","")) + "</td><td>" + str(v.get("id","")) + "</td><td><span style='color:" + color + ";font-weight:600'>" + sev + "</span></td><td>" + str(v.get("description",""))[:120] + "</td></tr>"
          if not rows:
              rows = "<tr><td colspan='5' style='color:green'>No vulnerabilities found</td></tr>"

          html = (
              "<!DOCTYPE html><html><head><title>Dependency Scan</title>"
              "<style>body{font-family:sans-serif;padding:1rem;background:#0d1117;color:#e6edf3}"
              "table{border-collapse:collapse;width:100%}"
              "th,td{border:1px solid #30363d;padding:8px 12px;text-align:left}"
              "th{background:#161b22;color:#8b949e;font-size:12px;text-transform:uppercase}"
              "tr:hover td{background:#161b22}</style></head>"
              "<body><h2 style='margin-bottom:1rem'>Dependency Scan (pip-audit)</h2>"
              "<table><tr><th>Package</th><th>Version</th><th>CVE</th><th>Severity</th><th>Description</th></tr>"
              + rows +
              "</table></body></html>"
          )
          open("reports/dependency-report.html", "w").write(html)
          print("Done. Vulnerabilities: " + str(vulns_total))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports/dependency-report.*
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 3 — dashboard
#   Runs only on main branch (not PRs).
#   Assembles all reports + a summary index.html →
#   deploys to GitHub Pages.
# ─────────────────────────────────────────────────────────────
  dashboard:
    name: Publish dashboard (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [test, lint, security, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write   # needed by peaceiris/actions-gh-pages

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Download all reports into separate directories
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: test-reports,       path: site/test-report }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: lint-report,        path: site/lint-report }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: security-report,    path: site/security-report }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: dependency-report,  path: site/dependency-report }

      # Build status.json from job outputs (proper approach — no artifact passing)
      - name: Build status.json
        run: |
          cat > site/status.json <<EOF
          {
            "commit":     "${{ github.sha }}",
            "branch":     "${{ github.ref_name }}",
            "run_id":     "${{ github.run_id }}",
            "timestamp":  "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "coverage":   ${{ needs.test.outputs.coverage || 0 }},
            "tests":      "passed",
            "lint":       "${{ needs.lint.outputs.status }}",
            "security":   "${{ needs.security.outputs.status }}",
            "dependency": "${{ needs.dependency-scan.outputs.status }}",
            "vuln_count": ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

      # Generate the dashboard index.html inline (no extra file needed in repo)
      - name: Generate dashboard HTML
        run: |
          cat > site/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1.0">
          <title>FastAPI CI/CD Dashboard</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#e6edf3;display:flex;min-height:100vh;font-size:13px}
          .sidebar{width:200px;min-width:200px;background:#010409;border-right:1px solid #21262d;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20;transition:transform .25s ease}
          .sb-brand{display:flex;align-items:center;gap:9px;padding:16px 14px 14px;border-bottom:1px solid #21262d}
          .sb-brand-icon{font-size:18px}
          .sb-brand-text{font-size:14px;font-weight:600;color:#58a6ff}
          .sb-nav{padding:8px 0;flex:1;overflow-y:auto}
          .sb-section{font-size:10px;color:#6e7681;padding:10px 14px 4px;text-transform:uppercase;letter-spacing:.08em}
          .sb-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-left:2px solid transparent;color:#8b949e;font-size:12px;text-decoration:none;transition:all .15s}
          .sb-item:hover{background:#0d1117;color:#e6edf3}
          .sb-item.active{background:#0d1117;color:#e6edf3;border-left-color:#58a6ff}
          .sb-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}
          .sb-badge{font-size:10px;padding:2px 7px;border-radius:10px;margin-left:auto;font-weight:500;flex-shrink:0}
          .ext{margin-left:auto;font-size:10px;color:#6e7681}
          .sb-divider{height:1px;background:#21262d;margin:4px 0}
          .sb-footer{padding:12px 14px;border-top:1px solid #21262d;display:flex;flex-direction:column;gap:6px}
          .sb-meta{font-size:11px;color:#8b949e;display:flex;align-items:center;gap:6px}
          .sb-meta svg{width:10px;height:10px;stroke:#6e7681;fill:none;stroke-width:1.5;flex-shrink:0}
          .sb-commit{font-size:10px;color:#6e7681;background:#161b22;border:1px solid #21262d;border-radius:5px;padding:2px 7px;font-family:monospace;display:inline-block}
          .hamburger{display:none;position:fixed;top:12px;left:12px;z-index:30;background:#161b22;border:1px solid #30363d;border-radius:7px;padding:7px 9px;cursor:pointer;flex-direction:column;gap:4px}
          .hamburger span{display:block;width:18px;height:2px;background:#e6edf3;border-radius:2px}
          .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15}
          .main{margin-left:200px;flex:1;display:flex;flex-direction:column;min-width:0}
          .topbar{background:#010409;border-bottom:1px solid #21262d;padding:14px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
          .page-title{font-size:20px;font-weight:600;color:#e6edf3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
          .health-badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
          .health-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
          .page-sub{font-size:12px;color:#8b949e;margin-top:3px}
          .run-btn{display:flex;align-items:center;gap:8px;background:#1c2128;border:1px solid #30363d;border-radius:8px;padding:8px 16px;color:#e6edf3;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0}
          .run-btn svg{width:14px;height:14px;fill:#58a6ff}
          .page-body{padding:18px 22px;flex:1}
          .pipeline-track{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:18px 24px;margin-bottom:16px;display:flex;align-items:center;overflow-x:auto;gap:0}
          .pt-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:70px}
          .pt-connector{flex:1;height:2px;margin-bottom:30px;min-width:12px;max-width:40px}
          .pt-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
          .pt-icon svg{width:18px;height:18px;fill:none;stroke-width:2}
          .pt-name{font-size:11px;font-weight:500;color:#e6edf3;text-align:center}
          .pt-status{font-size:10px;text-align:center}
          .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
          .kcard{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:14px 16px}
          .kcard-label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:500}
          .kcard-value{font-size:22px;font-weight:600;line-height:1;margin-bottom:6px}
          .kcard-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px}
          .kcard-sub{font-size:11px;color:#8b949e;margin-top:6px}
          .cov-bar-track{height:5px;background:#21262d;border-radius:3px;overflow:hidden;margin-top:8px}
          .cov-bar-fill{height:100%;border-radius:3px;transition:width 1.2s ease}
          .mid-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
          .panel{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:16px}
          .panel-title{font-size:13px;font-weight:500;color:#e6edf3;margin-bottom:14px}
          .chart-area{position:relative;height:170px}
          .vuln-wrap{display:flex;flex-direction:column;gap:10px}
          .vuln-donut-row{display:flex;align-items:center;gap:16px;justify-content:center}
          .vuln-legend{display:flex;flex-direction:column;gap:7px}
          .vl-item{display:flex;align-items:center;gap:8px;font-size:12px}
          .vl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
          .vl-name{color:#8b949e;flex:1}
          .vl-count{font-weight:600;color:#e6edf3;min-width:24px;text-align:right}
          .vuln-total{text-align:center;font-size:11px;color:#8b949e;padding:6px;background:#0d1117;border-radius:6px}
          .vuln-total b{color:#e6edf3}
          .vuln-sources{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
          .vsrc{font-size:10px;padding:2px 8px;border-radius:6px;background:#21262d;color:#8b949e}
          .activity-list{display:flex;flex-direction:column;overflow-y:auto;max-height:260px}
          .act-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #21262d;flex-shrink:0}
          .act-item:last-child{border-bottom:none}
          .act-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
          .act-icon svg{width:10px;height:10px;fill:none;stroke-width:2}
          .act-time{font-size:11px;font-weight:500;color:#e6edf3;margin-bottom:1px}
          .act-desc{font-size:11px;color:#8b949e}
          @media(max-width:1100px){.mid-grid{grid-template-columns:1fr 1fr}.mid-grid .panel:last-child{grid-column:1/-1}}
          @media(max-width:860px){.kpi-row{grid-template-columns:repeat(3,1fr)}.mid-grid{grid-template-columns:1fr}}
          @media(max-width:640px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block}.hamburger{display:flex}.main{margin-left:0}.topbar{padding:14px 14px 14px 52px}.page-body{padding:14px}.kpi-row{grid-template-columns:repeat(2,1fr)}}
          </style>
          </head>
          <body>
          <div class="hamburger" id="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
          <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
          <div class="sidebar" id="sidebar">
            <div class="sb-brand"><span class="sb-brand-icon">🚀</span><span class="sb-brand-text">FastAPI CI/CD</span></div>
            <div class="sb-nav">
              <a class="sb-item active" href="#"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>Overview</a>
              <div class="sb-section">Reports</div>
              <a class="sb-item" href="test-report/test-report.html"><svg viewBox="0 0 16 16"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M5 7l2 2 4-4"/></svg>Test Results<span class="sb-badge" id="sb-b-tests" style="background:#1a4731;color:#3fb950">pass</span></a>
              <a class="sb-item" href="test-report/htmlcov/index.html"><svg viewBox="0 0 16 16"><path d="M2 11l3-4 3 2.5 3-5 3 3.5"/></svg>Coverage HTML<span class="sb-badge" id="sb-b-cov" style="background:#0c2a4a;color:#58a6ff">—%</span></a>
