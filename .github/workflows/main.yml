# ============================================================
#  FASTAPI — PREMIUM PRODUCTION CI/CD PIPELINE
#  Enterprise DevOps Dashboard Edition
# ============================================================

name: FastAPI Production CI/CD

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# GLOBAL ENV
# ============================================================

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: fastapi-app

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOBS
# ============================================================

jobs:

# ============================================================
# TEST
# ============================================================

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |
          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage percentage
        id: coverage
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("reports/coverage.xml").getroot()

          pct = round(
              float(root.attrib.get("line-rate", 0)) * 100,
              2
          )

          print(f"Coverage: {pct}%")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pct={pct}\n")

          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

# ============================================================
# LINT
# ============================================================

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        id: run
        run: |
          mkdir -p reports

          if ruff check . --output-format=github --line-length 120; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Lint warnings found"
          fi

          ruff check . \
            --line-length 120 \
            --output-format=text \
            > reports/lint-report.txt 2>&1 || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/lint-report.txt

# ============================================================
# SECURITY
# ============================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        id: run
        run: |
          mkdir -p reports

          bandit -r app/ \
            -f json \
            -o reports/bandit-report.json || true

          bandit -r app/ \
            -f html \
            -o reports/bandit-report.html || true

          HIGH=$(python - <<'EOF'
          import json

          data = json.load(
              open("reports/bandit-report.json")
          )

          high = [
              i for i in data.get("results", [])
              if i.get("issue_severity") == "HIGH"
          ]

          print(len(high))
          EOF
          )

          TOTAL=$(python - <<'EOF'
          import json

          data = json.load(
              open("reports/bandit-report.json")
          )

          print(len(data.get("results", [])))
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$TOTAL" -gt "0" ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/bandit-report.*

# ============================================================
# DEPENDENCY SCAN
# ============================================================

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run dependency scan
        id: run
        run: |
          mkdir -p reports

          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/dependency-report.json || true

          python - <<'EOF'
          import json
          import os

          data = json.load(
              open("reports/dependency-report.json")
          )

          vulns = sum(
              len(dep.get("vulns", []))
              for dep in data.get("dependencies", [])
          )

          status = (
              "passed"
              if vulns == 0
              else "warning"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\n")
              f.write(f"vuln_count={vulns}\n")

          print(f"Vulnerabilities: {vulns}")
          EOF

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports/dependency-report.json

# ============================================================
# DASHBOARD
# ============================================================

  dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      # ============================================
      # DOWNLOAD REPORTS
      # ============================================

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site/test-report

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: site/lint-report

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: site/security-report

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: site/dependency-report

      # ============================================
      # BUILD STATUS.JSON
      # ============================================

      - name: Build status.json
        run: |
          cat > site/status.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",

            "coverage": ${{ needs.test.outputs.coverage || 0 }},

            "tests": "passed",

            "lint": "${{ needs.lint.outputs.status }}",

            "security": "${{ needs.security.outputs.status }}",

            "dependency": "${{ needs.dependency-scan.outputs.status }}",

            "vuln_count":
              ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

      # ============================================
      # GENERATE DASHBOARD
      # ============================================

      - name: Generate dashboard
        run: |
          mkdir -p site

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />

            <title>FastAPI CI/CD Dashboard</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

            <style>

              :root{
                --bg:#030712;
                --panel:#0f172a;
                --panel2:#111827;
                --border:#1e293b;
                --text:#f8fafc;
                --muted:#94a3b8;

                --green:#22c55e;
                --amber:#f59e0b;
                --red:#ef4444;
                --blue:#3b82f6;
                --cyan:#06b6d4;
                --purple:#8b5cf6;
              }

              *{
                margin:0;
                padding:0;
                box-sizing:border-box;
              }

              body{
                font-family:'Inter',sans-serif;
                background:
                radial-gradient(circle at top right,#0ea5e920,transparent 25%),
                radial-gradient(circle at bottom left,#8b5cf620,transparent 25%),
                var(--bg);

                color:var(--text);
                min-height:100vh;
                display:flex;
              }

              /* SIDEBAR */

              .sidebar{
                width:260px;
                background:rgba(15,23,42,.7);
                border-right:1px solid var(--border);
                backdrop-filter:blur(20px);
                padding:24px;
                position:fixed;
                inset:0 auto 0 0;
                display:flex;
                flex-direction:column;
                justify-content:space-between;
              }

              .logo{
                display:flex;
                align-items:center;
                gap:12px;
                font-size:28px;
                font-weight:800;
                margin-bottom:40px;
              }

              .logo-icon{
                width:42px;
                height:42px;
                border-radius:14px;
                background:linear-gradient(135deg,var(--cyan),var(--blue));
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:22px;
                box-shadow:0 0 30px #06b6d455;
              }

              .nav{
                display:flex;
                flex-direction:column;
                gap:10px;
              }

              .nav a{
                display:flex;
                align-items:center;
                gap:14px;
                padding:14px 18px;
                text-decoration:none;
                color:#cbd5e1;
                border-radius:16px;
                transition:.25s;
                border:1px solid transparent;
              }

              .nav a:hover{
                background:#ffffff08;
              }

              .nav a.active{
                background:linear-gradient(to right,#1d4ed820,#2563eb15);
                border-color:#3b82f630;
                color:white;
              }

              .side-card{
                background:rgba(15,23,42,.8);
                border:1px solid var(--border);
                border-radius:24px;
                padding:22px;
                line-height:2;
              }

              .side-label{
                color:var(--muted);
                font-size:13px;
              }

              /* MAIN */

              .main{
                margin-left:260px;
                width:100%;
                padding:28px;
              }

              /* HEADER */

              .top{
                display:flex;
                justify-content:space-between;
                align-items:flex-start;
                flex-wrap:wrap;
                gap:20px;
              }

              .title{
                font-size:52px;
                font-weight:900;
                line-height:1;
                letter-spacing:-2px;
              }

              .subtitle{
                margin-top:14px;
                color:var(--muted);
                font-size:17px;
              }

              .run-btn{
                border:none;
                color:white;
                background:linear-gradient(to right,var(--cyan),var(--blue));
                padding:16px 28px;
                border-radius:18px;
                font-weight:700;
                font-size:15px;
                cursor:pointer;
                box-shadow:0 10px 30px #06b6d440;
              }

              /* HERO */

              .hero{
                margin-top:28px;
                background:linear-gradient(to bottom right,#0f172acc,#020617ee);
                border:1px solid var(--border);
                border-radius:32px;
                padding:34px;
                position:relative;
                overflow:hidden;
              }

              .hero::before{
                content:'';
                position:absolute;
                width:420px;
                height:420px;
                background:#2563eb15;
                border-radius:50%;
                top:-180px;
                right:-120px;
                filter:blur(40px);
              }

              .healthy{
                display:inline-flex;
                align-items:center;
                gap:10px;
                padding:10px 18px;
                border-radius:999px;
                background:#22c55e15;
                border:1px solid #22c55e30;
                color:#86efac;
                font-weight:600;
              }

              .dot{
                width:10px;
                height:10px;
                border-radius:50%;
                background:var(--green);
                animation:pulse 1.5s infinite;
              }

              @keyframes pulse{
                0%{opacity:1}
                50%{opacity:.3}
                100%{opacity:1}
              }

              .hero-title{
                margin-top:22px;
                font-size:38px;
                font-weight:800;
                max-width:800px;
                line-height:1.2;
              }

              .hero-desc{
                margin-top:14px;
                color:var(--muted);
                line-height:1.8;
                max-width:850px;
              }

              /* PIPELINE */

              .pipeline{
                margin-top:34px;
                display:grid;
                grid-template-columns:repeat(6,1fr);
                gap:18px;
              }

              .stage{
                background:#ffffff05;
                border:1px solid #ffffff10;
                border-radius:24px;
                padding:22px;
                position:relative;
                overflow:hidden;
              }

              .stage::before{
                content:'';
                position:absolute;
                inset:0;
                opacity:.12;
              }

              .stage.success::before{
                background:var(--green);
              }

              .stage.warning::before{
                background:var(--amber);
              }

              .stage.failed::before{
                background:var(--red);
              }

              .stage-head{
                display:flex;
                justify-content:space-between;
                align-items:center;
              }

              .stage-icon{
                width:14px;
                height:14px;
                border-radius:50%;
              }

              .success .stage-icon{
                background:var(--green);
                box-shadow:0 0 15px #22c55e99;
              }

              .warning .stage-icon{
                background:var(--amber);
                box-shadow:0 0 15px #f59e0b99;
              }

              .stage-name{
                margin-top:18px;
                font-size:22px;
                font-weight:700;
              }

              .stage-status{
                margin-top:8px;
                color:var(--muted);
              }

              /* STATS */

              .stats{
                margin-top:28px;
                display:grid;
                grid-template-columns:repeat(4,1fr);
                gap:20px;
              }

              .card{
                background:rgba(15,23,42,.75);
                border:1px solid var(--border);
                border-radius:28px;
                padding:28px;
                position:relative;
                overflow:hidden;
                backdrop-filter:blur(16px);
              }

              .card::before{
                content:'';
                position:absolute;
                width:180px;
                height:180px;
                border-radius:50%;
                background:#ffffff08;
                top:-70px;
                right:-70px;
              }

              .card-label{
                color:var(--muted);
                font-size:13px;
                text-transform:uppercase;
                letter-spacing:.1em;
              }

              .card-value{
                margin-top:18px;
                font-size:54px;
                font-weight:900;
              }

              .badge{
                margin-top:18px;
                display:inline-flex;
                align-items:center;
                gap:10px;
                padding:10px 16px;
                border-radius:999px;
                font-weight:700;
              }

              .badge.green{
                background:#22c55e15;
                color:#4ade80;
              }

              .badge.amber{
                background:#f59e0b15;
                color:#fbbf24;
              }

              .progress{
                margin-top:24px;
                height:8px;
                background:#1e293b;
                border-radius:999px;
                overflow:hidden;
              }

              .progress-fill{
                height:100%;
                width:80%;
                background:linear-gradient(to right,var(--green),#4ade80);
                border-radius:999px;
              }

              /* GRID */

              .bottom{
                margin-top:28px;
                display:grid;
                grid-template-columns:2fr 1.2fr 1fr;
                gap:20px;
              }

              .panel{
                background:rgba(15,23,42,.75);
                border:1px solid var(--border);
                border-radius:28px;
                padding:28px;
              }

              .panel-title{
                font-size:24px;
                font-weight:700;
                margin-bottom:24px;
              }

              /* REPORTS */

              .reports{
                margin-top:20px;
                display:grid;
                grid-template-columns:repeat(5,1fr);
                gap:16px;
              }

              .report{
                background:#ffffff05;
                border:1px solid #ffffff10;
                border-radius:22px;
                padding:22px;
                transition:.25s;
                cursor:pointer;
              }

              .report:hover{
                transform:translateY(-4px);
                border-color:#3b82f6;
              }

              .report-icon{
                width:52px;
                height:52px;
                border-radius:18px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:24px;
                margin-bottom:18px;
              }

              .purple{background:#8b5cf620;color:#a78bfa;}
              .green{background:#22c55e20;color:#4ade80;}
              .amber{background:#f59e0b20;color:#fbbf24;}
              .red{background:#ef444420;color:#f87171;}
              .blue{background:#3b82f620;color:#60a5fa;}

              .report-title{
                font-weight:700;
              }

              .report-link{
                margin-top:12px;
                color:#93c5fd;
                font-size:14px;
              }

              /* TERMINAL */

              .terminal{
                background:black;
                border-radius:24px;
                padding:24px;
                border:1px solid #0ea5e930;
                font-family:monospace;
                color:#86efac;
                line-height:2;
                box-shadow:0 0 30px #06b6d410 inset;
              }

              /* TIMELINE */

              .timeline{
                display:flex;
                flex-direction:column;
                gap:24px;
              }

              .event{
                display:flex;
                gap:16px;
              }

              .event-dot{
                width:14px;
                height:14px;
                border-radius:50%;
                margin-top:5px;
                flex-shrink:0;
              }

              .event-time{
                color:var(--muted);
                font-size:13px;
                margin-bottom:6px;
              }

              /* RESPONSIVE */

              @media(max-width:1500px){

                .pipeline{
                  grid-template-columns:repeat(3,1fr);
                }

                .stats{
                  grid-template-columns:repeat(2,1fr);
                }

                .bottom{
                  grid-template-columns:1fr;
                }

                .reports{
                  grid-template-columns:repeat(2,1fr);
                }

              }

              @media(max-width:1100px){

                .sidebar{
                  display:none;
                }

                .main{
                  margin-left:0;
                }

                .pipeline{
                  grid-template-columns:repeat(2,1fr);
                }

              }

              @media(max-width:700px){

                .title{
                  font-size:38px;
                }

                .pipeline{
                  grid-template-columns:1fr;
                }

                .stats{
                  grid-template-columns:1fr;
                }

                .reports{
                  grid-template-columns:1fr;
                }

              }

            </style>

          </head>

          <body>

            <!-- SIDEBAR -->

            <aside class="sidebar">

              <div>

                <div class="logo">
                  <div class="logo-icon">⚡</div>
                  FastAPI CI/CD
                </div>

                <nav class="nav">
                  <a class="active">📊 Overview</a>
                  <a>🔄 Pipelines</a>
                  <a>🚀 Deployments</a>
                  <a>📁 Reports</a>
                  <a>🛡 Security</a>
                  <a>📜 Logs</a>
                </nav>

              </div>

              <div class="side-card">

                <div class="side-label">Repository</div>
                <div>FastAPI-CI-CD</div>

                <br>

                <div class="side-label">Branch</div>
                <div>main</div>

                <br>

                <div class="side-label">Commit</div>
                <div>2833df5</div>

                <br>

                <div class="side-label">Last Updated</div>
                <div>11 May 2026</div>

              </div>

            </aside>

            <!-- MAIN -->

            <main class="main">

              <!-- TOP -->

              <div class="top">

                <div>
                  <div class="title">
                    FastAPI pipeline dashboard
                  </div>

                  <div class="subtitle">
                    Commit 2833df5 • main • 11 May 2026, 11:05:24 UTC
                  </div>
                </div>

                <button class="run-btn">
                  ▶ Run #290730
                </button>

              </div>

              <!-- HERO -->

              <section class="hero">

                <div class="healthy">
                  <div class="dot"></div>
                  Pipeline Healthy
                </div>

                <div class="hero-title">
                  Production deployment monitoring & observability dashboard
                </div>

                <div class="hero-desc">
                  Real-time CI/CD visibility with testing, coverage analysis,
                  security scanning, dependency monitoring and deployment insights.
                </div>

                <!-- PIPELINE -->

                <div class="pipeline">

                  <div class="stage success">
                    <div class="stage-head">
                      <div>✔</div>
                      <div class="stage-icon"></div>
                    </div>

                    <div class="stage-name">Checkout</div>
                    <div class="stage-status">Completed</div>
                  </div>

                  <div class="stage success">
                    <div class="stage-head">
                      <div>✔</div>
                      <div class="stage-icon"></div>
                    </div>

                    <div class="stage-name">Tests</div>
                    <div class="stage-status">Passed</div>
                  </div>

                  <div class="stage success">
                    <div class="stage-head">
                      <div>✔</div>
                      <div class="stage-icon"></div>
                    </div>

                    <div class="stage-name">Coverage</div>
                    <div class="stage-status">80.4%</div>
                  </div>

                  <div class="stage warning">
                    <div class="stage-head">
                      <div>⚠</div>
                      <div class="stage-icon"></div>
                    </div>

                    <div class="stage-name">Lint</div>
                    <div class="stage-status">Warning</div>
                  </div>

                  <div class="stage warning">
                    <div class="stage-head">
                      <div>⚠</div>
                      <div class="stage-icon"></div>
                    </div>

                    <div class="stage-name">Security</div>
                    <div class="stage-status">Warning</div>
                  </div>

                  <div class="stage warning">
                    <div class="stage-head">
                      <div>⚠</div>
                      <div class="stage-icon"></div>
                    </div>

                    <div class="stage-name">Dependencies</div>
                    <div class="stage-status">35 vulns found</div>
                  </div>

                </div>

              </section>

              <!-- STATS -->

              <section class="stats">

                <div class="card">

                  <div class="card-label">Tests</div>

                  <div class="badge green">
                    ✔ passed
                  </div>

                </div>

                <div class="card">

                  <div class="card-label">Coverage</div>

                  <div class="card-value">
                    80.4%
                  </div>

                  <div class="progress">
                    <div class="progress-fill"></div>
                  </div>

                </div>

