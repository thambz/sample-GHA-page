            color:var(--text);

            overflow-x:hidden;
          }

          /* SIDEBAR */

          .sidebar{

            position:fixed;

            top:0;
            left:0;
            bottom:0;

            width:220px;

            background:#020817;

            border-right:1px solid var(--border);

