                  <div class="vuln-wrap">
                    <div class="vuln-donut-row">
                      <canvas id="donut-chart" width="110" height="110" style="flex-shrink:0"></canvas>
                      <div class="vuln-legend">
                        <div class="vl-item"><div class="vl-dot" style="background:#f85149"></div><span class="vl-name">Critical</span><span class="vl-count" id="vc-crit">—</span></div>
                        <div class="vl-item"><div class="vl-dot" style="background:#fb923c"></div><span class="vl-name">High</span><span class="vl-count" id="vc-high">—</span></div>
                        <div class="vl-item"><div class="vl-dot" style="background:#facc15"></div><span class="vl-name">Medium</span><span class="vl-count" id="vc-med">—</span></div>
                        <div class="vl-item"><div class="vl-dot" style="background:#60a5fa"></div><span class="vl-name">Low</span><span class="vl-count" id="vc-low">—</span></div>
                      </div>
                    </div>
                    <div class="vuln-total" id="vuln-total">Total: <b>—</b></div>
                    <div class="vuln-sources"><span class="vsrc" id="vsrc-bandit">bandit: —</span><span class="vsrc" id="vsrc-pip">pip-audit: —</span></div>
                  </div>
                </div>
                <div class="panel"><div class="panel-title">Recent Activity</div><div class="activity-list" id="activity-list"></div></div>
              </div>
