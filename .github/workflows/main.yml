          EOF

# ============================================================
# NO JEKYLL
# ============================================================

      - name: Disable Jekyll
        run: touch site/.nojekyll

# ============================================================
# DEPLOY
# ============================================================

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true