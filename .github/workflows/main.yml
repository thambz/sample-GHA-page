# ============================================================
#  FastAPI — Premium Production CI/CD Pipeline
#  Premium DevOps Dashboard Edition
# ============================================================

name: FastAPI Production CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: fastapi-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ============================================================
# TEST
# ============================================================

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |
          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage
        id: coverage
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("reports/coverage.xml").getroot()
          pct = round(float(root.attrib.get("line-rate", 0)) * 100, 2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pct={pct}\n")

          print(f"Coverage: {pct}%")
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

# ============================================================
# LINT
# ============================================================

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        id: run
        run: |
          mkdir -p reports

          if ruff check . --output-format=github --line-length 120; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Lint issues found"
          fi

          ruff check . \
            --line-length 120 \
            --output-format=text \
            > reports/lint-report.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: reports/lint-report.txt

# ============================================================
# SECURITY
# ============================================================

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        id: run
        run: |
          mkdir -p reports

          bandit -r app/ -f json -o reports/bandit-report.json || true
          bandit -r app/ -f html -o reports/bandit-report.html || true

          HIGH=$(python - <<'EOF'
          import json
          data = json.load(open("reports/bandit-report.json"))
          high = [i for i in data.get("results", []) if i.get("issue_severity") == "HIGH"]
          print(len(high))
          EOF
          )

          TOTAL=$(python - <<'EOF'
          import json
          data = json.load(open("reports/bandit-report.json"))
          print(len(data.get("results", [])))
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$TOTAL" -gt "0" ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/bandit-report.*

# ============================================================
# DEPENDENCY SCAN
# ============================================================

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        id: run
        run: |
          mkdir -p reports

          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/dependency-report.json || true

          python - <<'EOF'
          import json, os

          data = json.load(open("reports/dependency-report.json"))

          vulns = sum(
              len(dep.get("vulns", []))
              for dep in data.get("dependencies", [])
          )

          status = "passed" if vulns == 0 else "warning"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\n")
              f.write(f"vuln_count={vulns}\n")

          print("Vulnerabilities:", vulns)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports/dependency-report.json

# ============================================================
# DASHBOARD
# ============================================================

  dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site/test-report

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: site/lint-report

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: site/security-report

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: site/dependency-report

      - name: Build status.json
        run: |
          cat > site/status.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "coverage": ${{ needs.test.outputs.coverage || 0 }},
            "tests": "passed",
            "lint": "${{ needs.lint.outputs.status }}",
            "security": "${{ needs.security.outputs.status }}",
            "dependency": "${{ needs.dependency-scan.outputs.status }}",
            "vuln_count": ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

      - name: Generate Premium Dashboard
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FastAPI Premium Dashboard</title>

            <style>

              :root{
                --bg:#020617;
                --card:#0f172a;
                --border:#1e293b;
                --text:#e2e8f0;
                --muted:#94a3b8;
                --green:#22c55e;
                --amber:#f59e0b;
                --red:#ef4444;
                --cyan:#06b6d4;
                --blue:#3b82f6;
              }

              *{
                margin:0;
                padding:0;
                box-sizing:border-box;
              }

              body{
                font-family:Inter,Segoe UI,sans-serif;
                background:
                  radial-gradient(circle at top right,#0ea5e920,transparent 25%),
                  radial-gradient(circle at bottom left,#8b5cf620,transparent 25%),
                  var(--bg);

                color:var(--text);
                min-height:100vh;
                display:flex;
              }

              .sidebar{
                width:260px;
                background:rgba(15,23,42,.65);
                backdrop-filter:blur(20px);
                border-right:1px solid var(--border);
                padding:30px 20px;
                position:fixed;
                top:0;
                left:0;
                bottom:0;
              }

              .logo{
                font-size:28px;
                font-weight:900;
                margin-bottom:40px;
              }

              .nav{
                display:flex;
                flex-direction:column;
                gap:10px;
              }

              .nav a{
                text-decoration:none;
                color:#cbd5e1;
                padding:14px 18px;
                border-radius:16px;
                transition:.25s;
              }

              .nav a:hover{
                background:#ffffff10;
              }

              .nav a.active{
                background:linear-gradient(to right,#0891b220,#2563eb15);
                border:1px solid #0ea5e930;
                color:white;
              }

              .main{
                margin-left:260px;
                width:100%;
                padding:35px;
              }

              .top{
                display:flex;
                justify-content:space-between;
                align-items:center;
                flex-wrap:wrap;
                gap:20px;
              }

              .title{
                font-size:54px;
                font-weight:900;
                line-height:1;
              }

              .subtitle{
                margin-top:12px;
                color:var(--muted);
              }

              .run-btn{
                background:linear-gradient(to right,#06b6d4,#2563eb);
                padding:16px 28px;
                border:none;
                color:white;
                border-radius:18px;
                font-weight:700;
                box-shadow:0 10px 30px #0891b240;
              }

              .hero{
                margin-top:35px;
                background:linear-gradient(to bottom right,#0f172acc,#020617cc);
                border:1px solid var(--border);
                border-radius:32px;
                padding:40px;
                position:relative;
                overflow:hidden;
              }

              .status-pill{
                display:inline-flex;
                align-items:center;
                gap:10px;
                background:#22c55e15;
                border:1px solid #22c55e30;
                color:#86efac;
                padding:10px 18px;
                border-radius:999px;
              }

              .dot{
                width:10px;
                height:10px;
                border-radius:50%;
                background:#22c55e;
                animation:pulse 1.5s infinite;
              }

              @keyframes pulse{
                0%{opacity:1}
                50%{opacity:.3}
                100%{opacity:1}
              }

              .hero-title{
                margin-top:25px;
                font-size:42px;
                font-weight:800;
              }

              .hero-desc{
                margin-top:14px;
                color:var(--muted);
                line-height:1.8;
                max-width:800px;
              }

              .pipeline{
                margin-top:35px;
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
                gap:18px;
              }

              .stage{
                background:#ffffff08;
                border:1px solid #ffffff10;
                padding:22px;
                border-radius:24px;
              }

              .stage-name{
                font-size:20px;
                font-weight:700;
              }

              .stage-status{
                margin-top:12px;
                color:#cbd5e1;
              }

              .stats{
                margin-top:30px;
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
                gap:22px;
              }

              .card{
                background:rgba(15,23,42,.7);
                border:1px solid var(--border);
                border-radius:28px;
                padding:28px;
              }

              .label{
                color:var(--muted);
                text-transform:uppercase;
                letter-spacing:.1em;
                font-size:13px;
              }

              .big{
                font-size:54px;
                font-weight:900;
                margin-top:16px;
              }

              .progress{
                margin-top:22px;
                height:8px;
                border-radius:999px;
                background:#1e293b;
                overflow:hidden;
              }

              .fill{
                height:100%;
                background:linear-gradient(to right,#06b6d4,#2563eb);
              }

              .reports{
                margin-top:35px;
              }

              .report-links{
                display:flex;
                flex-wrap:wrap;
                gap:14px;
                margin-top:20px;
              }

              .report-links a{
                text-decoration:none;
                color:white;
                background:#0f172a;
                border:1px solid var(--border);
                padding:14px 18px;
                border-radius:16px;
              }

              .terminal{
                margin-top:35px;
                background:black;
                border-radius:28px;
                padding:28px;
                border:1px solid #0ea5e930;
                font-family:monospace;
                color:#86efac;
                line-height:2;
              }

              .footer{
                margin-top:30px;
                color:var(--muted);
              }

            </style>
          </head>

          <body>

            <div class="sidebar">

              <div class="logo">
                FastAPI CI/CD
              </div>

              <div class="nav">
                <a class="active">Overview</a>
                <a>Pipelines</a>
                <a>Deployments</a>
                <a>Security</a>
                <a>Metrics</a>
                <a>Logs</a>
              </div>

            </div>

            <div class="main">

              <div class="top">

                <div>
                  <div class="title">Pipeline Dashboard</div>
                  <div class="subtitle" id="meta">
                    Loading...
                  </div>
                </div>

                <button class="run-btn" id="runid">
                  Run
                </button>

              </div>

              <div class="hero">

                <div class="status-pill">
                  <div class="dot"></div>
                  Production Healthy
                </div>

                <div class="hero-title">
                  Premium Production Pipeline
                </div>

                <div class="hero-desc">
                  Real-time FastAPI CI/CD monitoring dashboard with testing,
                  security analysis, dependency tracking and deployment visibility.
                </div>

                <div class="pipeline">

                  <div class="stage">
                    <div class="stage-name">Checkout</div>
                    <div class="stage-status">Completed</div>
                  </div>

                  <div class="stage">
                    <div class="stage-name">Testing</div>
                    <div class="stage-status">Passed</div>
                  </div>

                  <div class="stage">
                    <div class="stage-name">Lint</div>
                    <div class="stage-status">Warning</div>
                  </div>

                  <div class="stage">
                    <div class="stage-name">Security</div>
                    <div class="stage-status">Scanning</div>
                  </div>

                  <div class="stage">
                    <div class="stage-name">Deploy</div>
                    <div class="stage-status">Running</div>
                  </div>

                </div>

              </div>

              <div class="stats">

                <div class="card">
                  <div class="label">Coverage</div>
                  <div class="big" id="coverage">0%</div>

                  <div class="progress">
                    <div class="fill" id="covfill"></div>
                  </div>
                </div>

                <div class="card">
                  <div class="label">Tests</div>
                  <div class="big">PASSED</div>
                </div>

                <div class="card">
                  <div class="label">Security</div>
                  <div class="big" id="security-status">SAFE</div>
                </div>

                <div class="card">
                  <div class="label">Vulnerabilities</div>
                  <div class="big" id="vulns">0</div>
                </div>

              </div>

              <div class="reports">

                <div class="label">
                  REPORTS
                </div>

                <div class="report-links">

                  <a href="test-report/test-report.html">
                    Test Results
                  </a>

                  <a href="test-report/htmlcov/index.html">
                    Coverage
                  </a>

                  <a href="lint-report/lint-report.txt">
                    Lint
                  </a>

                  <a href="security-report/bandit-report.html">
                    Security
                  </a>

                  <a href="dependency-report/dependency-report.json">
                    Dependencies
                  </a>

                </div>

              </div>

              <div class="terminal">

                [INFO] Initializing pipeline...<br>
                [INFO] Installing dependencies...<br>
                [SUCCESS] Tests passed successfully<br>
                [INFO] Running security analysis...<br>
                [WARNING] Vulnerabilities detected<br>
                [INFO] Deploying application...<br>
                [SUCCESS] Deployment completed<br>

              </div>

              <div class="footer" id="footer">
                Generated...
              </div>

            </div>

            <script>

              fetch("status.json")
              .then(r => r.json())
              .then(d => {

                document.getElementById("meta").innerText =
                  "Commit " +
                  d.commit.slice(0,7) +
                  " • " +
                  d.branch +
                  " • " +
                  d.timestamp.replace("T"," ").replace("Z"," UTC");

                document.getElementById("runid").innerText =
                  "Run #" + d.run_id.toString().slice(-6);

                document.getElementById("coverage").innerText =
                  d.coverage.toFixed(1) + "%";

                document.getElementById("covfill").style.width =
                  d.coverage + "%";

                document.getElementById("vulns").innerText =
                  d.vuln_count;

                document.getElementById("security-status").innerText =
                  d.security.toUpperCase();

                const ts = new Date(d.timestamp);

                document.getElementById("footer").innerText =
                  "Generated " +
                  ts.toLocaleString("en-IN",{
                    timeZone:"Asia/Kolkata",
                    dateStyle:"medium",
                    timeStyle:"short"
                  }) + " IST";

              });

            </script>

          </body>
          </html>
          EOF

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true