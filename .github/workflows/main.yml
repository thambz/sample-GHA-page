# ============================================================
# FastAPI — Premium Production CI/CD Pipeline
# Enterprise DevOps Dashboard Edition
# ============================================================

name: FastAPI Production CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ============================================================
# TEST
# ============================================================

  test:

    name: Test & Coverage

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |

          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage
        id: coverage
        run: |

          python - <<'EOF'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse(
            "reports/coverage.xml"
          ).getroot()

          pct = round(
            float(
              root.attrib.get(
                "line-rate",
                0
              )
            ) * 100,
            2
          )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

              f.write(f"pct={pct}\n")

          print(f"Coverage: {pct}%")
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

# ============================================================
# LINT
# ============================================================

  lint:

    name: Lint

    runs-on: ubuntu-latest

    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        id: run
        run: |

          mkdir -p reports

          if ruff check . \
            --line-length 120 \
            --output-format=github; then

            echo "status=passed" >> "$GITHUB_OUTPUT"

          else

            echo "status=warning" >> "$GITHUB_OUTPUT"

          fi

          ruff check . \
            --line-length 120 \
            --output-format=text \
            > reports/lint-report.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: reports/lint-report.txt

# ============================================================
# SECURITY
# ============================================================

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        id: run
        run: |

          mkdir -p reports

          bandit -r app/ \
            -f json \
            -o reports/bandit-report.json || true

          bandit -r app/ \
            -f html \
            -o reports/bandit-report.html || true

          HIGH=$(python - <<'EOF'
          import json

          data = json.load(
            open(
              "reports/bandit-report.json"
            )
          )

          high = [
            i for i in data.get(
              "results",
              []
            )

            if i.get(
              "issue_severity"
            ) == "HIGH"
          ]

          print(len(high))
          EOF
          )

          TOTAL=$(python - <<'EOF'
          import json

          data = json.load(
            open(
              "reports/bandit-report.json"
            )
          )

          print(
            len(
              data.get(
                "results",
                []
              )
            )
          )
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then

            echo "status=failed" >> "$GITHUB_OUTPUT"

          elif [ "$TOTAL" -gt "0" ]; then

            echo "status=warning" >> "$GITHUB_OUTPUT"

          else

            echo "status=passed" >> "$GITHUB_OUTPUT"

          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/bandit-report.*

# ============================================================
# DEPENDENCY SCAN
# ============================================================

  dependency-scan:

    name: Dependency Scan

    runs-on: ubuntu-latest

    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        id: run
        run: |

          mkdir -p reports

          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/dependency-report.json || true

          python - <<'EOF'

          import json
          import os

          data = json.load(
            open(
              "reports/dependency-report.json"
            )
          )

          vulns = sum(
            len(dep.get("vulns", []))
            for dep in data.get(
              "dependencies",
              []
            )
          )

          status = (
            "passed"
            if vulns == 0
            else "warning"
          )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

              f.write(f"status={status}\n")
              f.write(f"vuln_count={vulns}\n")

          print("Vulnerabilities:", vulns)

          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports/dependency-report.json

# ============================================================
# DASHBOARD
# ============================================================

  dashboard:

    name: Publish Dashboard

    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site/test-report

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: site/lint-report

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: site/security-report

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: site/dependency-report

# ============================================================
# STATUS.JSON
# ============================================================

      - name: Build status.json
        run: |

          mkdir -p site

          cat > site/status.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",

            "coverage": ${{ needs.test.outputs.coverage || 0 }},

            "tests": "passed",

            "lint": "${{ needs.lint.outputs.status }}",

            "security": "${{ needs.security.outputs.status }}",

            "dependency": "${{ needs.dependency-scan.outputs.status }}",

            "vuln_count":
              ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

