          }

          .logo{

            font-size:26px;
            font-weight:900;

            margin-bottom:28px;
          }

          .menu{

            display:flex;
            flex-direction:column;

            gap:10px;
          }

          .menu a{

            padding:12px 16px;

            border-radius:14px;

            text-decoration:none;

            color:white;

            font-size:14px;

            background:#111827;

            border:1px solid transparent;

            transition:.25s;
          }

          .menu a:hover{
            border-color:#2563eb;
          }

          .section{

            margin-top:30px;
          }

          .section-title{

            color:#64748b;

            font-size:11px;

            letter-spacing:.18em;

            margin-bottom:12px;
          }

          .report{

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:12px 10px;

            border-radius:12px;

            margin-bottom:8px;

            text-decoration:none;

