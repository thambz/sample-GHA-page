# ============================================================
#  FASTAPI — PREMIUM PRODUCTION CI/CD PIPELINE
#  Enterprise DevOps Dashboard Edition
# ============================================================

name: FastAPI Production CI/CD

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# GLOBAL ENV
# ============================================================

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: fastapi-app

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOBS
# ============================================================

jobs:

# ============================================================
# TEST
# ============================================================

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |
          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage percentage
        id: coverage
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("reports/coverage.xml").getroot()

          pct = round(
              float(root.attrib.get("line-rate", 0)) * 100,
              2
          )

          print(f"Coverage: {pct}%")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pct={pct}\n")

          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

# ============================================================
# LINT
# ============================================================

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        id: run
        run: |
          mkdir -p reports

          if ruff check . --output-format=github --line-length 120; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Lint warnings found"
          fi

          ruff check . \
            --line-length 120 \
            --output-format=text \
            > reports/lint-report.txt 2>&1 || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/lint-report.txt

# ============================================================
# SECURITY
# ============================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        id: run
        run: |
          mkdir -p reports

          bandit -r app/ \
            -f json \
            -o reports/bandit-report.json || true

          bandit -r app/ \
            -f html \
            -o reports/bandit-report.html || true

          HIGH=$(python - <<'EOF'
          import json

          data = json.load(
              open("reports/bandit-report.json")
          )

          high = [
              i for i in data.get("results", [])
              if i.get("issue_severity") == "HIGH"
          ]

          print(len(high))
          EOF
          )

          TOTAL=$(python - <<'EOF'
          import json

          data = json.load(
              open("reports/bandit-report.json")
          )

          print(len(data.get("results", [])))
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$TOTAL" -gt "0" ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/bandit-report.*

# ============================================================
# DEPENDENCY SCAN
# ============================================================

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run dependency scan
        id: run
        run: |
          mkdir -p reports

          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/dependency-report.json || true

          python - <<'EOF'
          import json
          import os

          data = json.load(
              open("reports/dependency-report.json")
          )

          vulns = sum(
              len(dep.get("vulns", []))
              for dep in data.get("dependencies", [])
          )

          status = (
              "passed"
              if vulns == 0
              else "warning"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\n")
              f.write(f"vuln_count={vulns}\n")

          print(f"Vulnerabilities: {vulns}")
          EOF

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports/dependency-report.json

# ============================================================
# DASHBOARD
# ============================================================

  dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      # ============================================
      # DOWNLOAD REPORTS
      # ============================================

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site/test-report

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: site/lint-report

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: site/security-report

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: site/dependency-report

      # ============================================
      # BUILD STATUS.JSON
      # ============================================

      - name: Build status.json
        run: |
          cat > site/status.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",

            "coverage": ${{ needs.test.outputs.coverage || 0 }},

            "tests": "passed",

            "lint": "${{ needs.lint.outputs.status }}",

            "security": "${{ needs.security.outputs.status }}",

            "dependency": "${{ needs.dependency-scan.outputs.status }}",

            "vuln_count":
              ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

      # ============================================
      # GENERATE DASHBOARD
      # ============================================

      - name: Generate dashboard
        run: |
          mkdir -p site

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>

            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />

            <title>FastAPI CI/CD Dashboard</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">

            <link
              href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
              rel="stylesheet"
            >

            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

            <style>

              :root{

                --bg:#030712;
                --panel:#0f172a;
                --border:#1e293b;

                --text:#f8fafc;
                --muted:#94a3b8;

                --green:#22c55e;
                --amber:#f59e0b;
                --red:#ef4444;
                --blue:#3b82f6;
                --cyan:#06b6d4;
                --purple:#8b5cf6;
              }

              *{
                margin:0;
                padding:0;
                box-sizing:border-box;
              }

              body{

                font-family:'Inter',sans-serif;

                background:
                radial-gradient(circle at top right,#0ea5e920,transparent 25%),
                radial-gradient(circle at bottom left,#8b5cf620,transparent 25%),
                var(--bg);

                color:var(--text);

                min-height:100vh;

                overflow-x:hidden;
              }

              /* SIDEBAR */

              .sidebar{

                width:220px;

                background:rgba(15,23,42,.75);

                border-right:1px solid var(--border);

                backdrop-filter:blur(18px);

                position:fixed;

                top:0;
                left:0;
                bottom:0;

                padding:20px;

                display:flex;
                flex-direction:column;
                justify-content:space-between;
              }

              .logo{

                display:flex;
                align-items:center;
                gap:10px;

                font-size:24px;
                font-weight:800;

                margin-bottom:35px;
              }

              .logo-icon{

                width:38px;
                height:38px;

                border-radius:12px;

                background:
                linear-gradient(
                  135deg,
                  var(--cyan),
                  var(--blue)
                );

                display:flex;
                align-items:center;
                justify-content:center;

                font-size:18px;

                box-shadow:0 0 25px #06b6d455;
              }

              .nav{

                display:flex;
                flex-direction:column;
                gap:8px;
              }

              .nav a{

                text-decoration:none;

                color:#cbd5e1;

                padding:12px 14px;

                border-radius:14px;

                transition:.25s;

                border:1px solid transparent;

                font-size:15px;
              }

              .nav a:hover{
                background:#ffffff08;
              }

              .nav a.active{

                background:
                linear-gradient(
                  to right,
                  #1d4ed820,
                  #2563eb15
                );

                border-color:#3b82f630;

                color:white;
              }

              .side-card{

                background:rgba(15,23,42,.8);

                border:1px solid var(--border);

                border-radius:20px;

                padding:18px;

                line-height:1.9;

                font-size:14px;
              }

              .side-label{

                color:var(--muted);

                font-size:12px;
              }

              /* MAIN */

              .main{

                margin-left:220px;

                width:calc(100vw - 220px);

                padding:20px 24px;
              }

              /* TOP */

              .top{

                display:flex;
                justify-content:space-between;
                align-items:flex-start;

                gap:20px;

                flex-wrap:wrap;
              }

              .title{

                font-size:36px;
                font-weight:900;

                line-height:1.1;

                letter-spacing:-1px;
              }

              .subtitle{

                margin-top:10px;

                color:var(--muted);

                font-size:15px;
              }

              .run-btn{

                border:none;

                background:
                linear-gradient(
                  to right,
                  var(--cyan),
                  var(--blue)
                );

                color:white;

                padding:14px 22px;

                border-radius:14px;

                font-weight:700;

                cursor:pointer;

                box-shadow:0 8px 25px #06b6d440;
              }

              /* HERO */

              .hero{

                margin-top:22px;

                width:100%;

                background:
                linear-gradient(
                  to bottom right,
                  #0f172acc,
                  #020617ee
                );

                border:1px solid var(--border);

                border-radius:26px;

                padding:24px;

                position:relative;

                overflow:hidden;
              }

              .hero::before{

                content:'';

                position:absolute;

                width:280px;
                height:280px;

                border-radius:50%;

                background:#2563eb15;

                top:-120px;
                right:-100px;

                filter:blur(40px);
              }

              .healthy{

                display:inline-flex;
                align-items:center;
                gap:10px;

                background:#22c55e15;

                border:1px solid #22c55e30;

                color:#86efac;

                padding:8px 14px;

                border-radius:999px;

                font-size:14px;
                font-weight:600;
              }

              .dot{

                width:8px;
                height:8px;

                border-radius:50%;

                background:var(--green);

                animation:pulse 1.5s infinite;
              }

              @keyframes pulse{

                0%{opacity:1}
                50%{opacity:.3}
                100%{opacity:1}
              }

              .hero-title{

                margin-top:18px;

                font-size:30px;
                font-weight:800;

                line-height:1.2;

                max-width:700px;
              }

              .hero-desc{

                margin-top:12px;

                color:var(--muted);

                line-height:1.7;

                max-width:850px;

                font-size:15px;
              }

              /* PIPELINE */

              .pipeline{

                margin-top:26px;

                display:flex;
                align-items:center;

                gap:12px;

                overflow-x:auto;

                padding-bottom:5px;
              }

              .pipeline::-webkit-scrollbar{
                height:5px;
              }

              .pipeline::-webkit-scrollbar-thumb{
                background:#334155;
                border-radius:999px;
              }

              .stage{

                min-width:170px;

                background:#ffffff05;

                border:1px solid #ffffff10;

                border-radius:18px;

                padding:16px;

                position:relative;

                overflow:hidden;

                flex-shrink:0;
              }

              .stage::before{

                content:'';

                position:absolute;

                inset:0;

                opacity:.12;
              }

              .stage.success::before{
                background:var(--green);
              }

              .stage.warning::before{
                background:var(--amber);
              }

              .stage.failed::before{
                background:var(--red);
              }

              .stage-head{

                display:flex;
                justify-content:space-between;
                align-items:center;
              }

              .stage-icon{

                width:12px;
                height:12px;

                border-radius:50%;
              }

              .success .stage-icon{
                background:var(--green);
                box-shadow:0 0 12px #22c55e99;
              }

              .warning .stage-icon{
                background:var(--amber);
                box-shadow:0 0 12px #f59e0b99;
              }

              .stage-name{

                margin-top:12px;

                font-size:17px;
                font-weight:700;
              }

              .stage-status{

                margin-top:6px;

                color:var(--muted);

                font-size:13px;
              }

              .connector{

                min-width:50px;

                height:2px;

                background:
                linear-gradient(
                  to right,
                  #334155,
                  #475569
                );

                position:relative;

                flex-shrink:0;
              }

              .connector::after{

                content:'';

                position:absolute;

                right:-2px;
                top:-3px;

                width:8px;
                height:8px;

                border-radius:50%;

                background:#64748b;
              }

              /* STATS */

              .stats{

                margin-top:20px;

                display:grid;
                grid-template-columns:repeat(4,1fr);

                gap:16px;

                width:100%;
              }

              .card{

                background:rgba(15,23,42,.75);

                border:1px solid var(--border);

                border-radius:22px;

                padding:20px;

                position:relative;

                overflow:hidden;
              }

              .card::before{

                content:'';

                position:absolute;

                width:130px;
                height:130px;

                border-radius:50%;

                background:#ffffff08;

                top:-50px;
                right:-50px;
              }

              .card-label{

                color:var(--muted);

                font-size:12px;

                text-transform:uppercase;

                letter-spacing:.1em;
              }

              .card-value{

                margin-top:14px;

                font-size:38px;
                font-weight:900;
              }

              .badge{

                margin-top:14px;

                display:inline-flex;
                align-items:center;
                gap:8px;

                padding:8px 14px;

                border-radius:999px;

                font-size:14px;
                font-weight:700;
              }

              .badge.green{

                background:#22c55e15;

                color:#4ade80;
              }

              .badge.amber{

                background:#f59e0b15;

                color:#fbbf24;
              }

              .progress{

                margin-top:18px;

                height:7px;

                background:#1e293b;

                border-radius:999px;

                overflow:hidden;
              }

              .progress-fill{

                height:100%;

                width:80%;

                background:
                linear-gradient(
                  to right,
                  var(--green),
                  #4ade80
                );

                border-radius:999px;
              }

              /* BOTTOM */

              .bottom{

                margin-top:20px;

                display:grid;
                grid-template-columns:1.2fr 1fr;

                gap:16px;

                width:100%;
              }

              .panel{

                background:rgba(15,23,42,.75);

                border:1px solid var(--border);

                border-radius:22px;

                padding:20px;
              }

              .panel-title{

                font-size:20px;
                font-weight:700;

                margin-bottom:18px;
              }

              canvas{
                max-width:100% !important;
              }

              /* REPORTS */

              .reports{

                margin-top:18px;

                display:grid;
                grid-template-columns:repeat(2,1fr);

                gap:12px;
              }

              .report{

                background:#ffffff05;

                border:1px solid #ffffff10;

                border-radius:18px;

                padding:16px;

                transition:.25s;

                cursor:pointer;
              }

              .report:hover{

                transform:translateY(-3px);

                border-color:#3b82f6;
              }

              .report-icon{

                width:42px;
                height:42px;

                border-radius:14px;

                display:flex;
                align-items:center;
                justify-content:center;

                font-size:20px;

                margin-bottom:12px;
              }

              .purple{
                background:#8b5cf620;
                color:#a78bfa;
              }

              .green{
                background:#22c55e20;
                color:#4ade80;
              }

              .amber{
                background:#f59e0b20;
                color:#fbbf24;
              }

              .red{
                background:#ef444420;
                color:#f87171;
              }

              .blue{
                background:#3b82f620;
                color:#60a5fa;
              }

              .report-title{

                font-weight:700;

                font-size:14px;
              }

              .report-link{

                margin-top:10px;

                color:#93c5fd;

                font-size:13px;
              }

              /* TERMINAL */

              .terminal{

                background:black;

                border-radius:18px;

                padding:18px;

                border:1px solid #0ea5e930;

                font-family:monospace;

                color:#86efac;

                line-height:1.9;

                font-size:13px;

                margin-top:18px;
              }

              /* TIMELINE */

              .timeline{

                display:flex;
                flex-direction:column;

                gap:18px;
              }

              .event{

                display:flex;

                gap:14px;
              }

              .event-dot{

                width:12px;
                height:12px;

                border-radius:50%;

                margin-top:5px;

                flex-shrink:0;
              }

              .event-time{

                color:var(--muted);

                font-size:12px;

                margin-bottom:4px;
              }

              /* RESPONSIVE */

              @media(max-width:1300px){

                .stats{
                  grid-template-columns:repeat(2,1fr);
                }

                .bottom{
                  grid-template-columns:1fr;
                }
              }

              @media(max-width:900px){

                .sidebar{
                  display:none;
                }

                .main{
                  margin-left:0;
                  width:100%;
                }
              }

              @media(max-width:700px){

                .stats{
                  grid-template-columns:1fr;
                }

                .reports{
                  grid-template-columns:1fr;
                }

                .title{
                  font-size:28px;
                }
              }

            </style>

          </head>

          <body>

            <!-- SIDEBAR -->

            <aside class="sidebar">

              <div>

                <div class="logo">

                  <div class="logo-icon">
                    ⚡
                  </div>

                  FastAPI CI/CD

                </div>

                <nav class="nav">

                  <a class="active">
                    📊 Overview
                  </a>

                  <a>
                    🔄 Pipelines
                  </a>

                  <a>
                    🚀 Deployments
                  </a>

                  <a>
                    📁 Reports
                  </a>

                  <a>
                    🛡 Security
                  </a>

                  <a>
                    📜 Logs
                  </a>

                </nav>

              </div>

              <div class="side-card">

                <div class="side-label">
                  Repository
                </div>

                <div>
                  FastAPI-CI-CD
                </div>

                <br>

                <div class="side-label">
                  Branch
                </div>

                <div>
                  main
                </div>

                <br>

                <div class="side-label">
                  Commit
                </div>

                <div>
                  2833df5
                </div>

                <br>

                <div class="side-label">
                  Last Updated
                </div>

                <div>
                  11 May 2026
                </div>

              </div>

            </aside>

            <!-- MAIN -->

            <main class="main">

              <!-- TOP -->

              <div class="top">

                <div>

                  <div class="title">
                    FastAPI pipeline dashboard
                  </div>

                  <div class="subtitle">
                    Commit 2833df5 • main • 11 May 2026, 11:05:24 UTC
                  </div>

                </div>

                <button class="run-btn">
                  ▶ Run #290730
                </button>

              </div>

              <!-- HERO -->

              <section class="hero">

                <div class="healthy">

                  <div class="dot"></div>

                  Pipeline Healthy

                </div>

                <div class="hero-title">

                  Production deployment monitoring & observability dashboard

                </div>

                <div class="hero-desc">

                  Real-time CI/CD visibility with testing, coverage analysis,
                  security scanning, dependency monitoring and deployment insights.

                </div>

                <!-- PIPELINE -->

                <div class="pipeline">

                  <div class="stage success">

                    <div class="stage-head">

                      <div>✔</div>

                      <div class="stage-icon"></div>

                    </div>

                    <div class="stage-name">
                      Checkout
                    </div>

                    <div class="stage-status">
                      Completed
                    </div>

                  </div>

                  <div class="connector"></div>

                  <div class="stage success">

                    <div class="stage-head">

                      <div>✔</div>

                      <div class="stage-icon"></div>

                    </div>

                    <div class="stage-name">
                      Tests
                    </div>

                    <div class="stage-status">
                      Passed
                    </div>

                  </div>

                  <div class="connector"></div>

                  <div class="stage success">

