# ============================================================
# FastAPI — Premium Production CI/CD Pipeline
# Enterprise DevOps Dashboard Edition
# Compact Responsive Version
# ============================================================

name: FastAPI Production CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ============================================================
# TEST
# ============================================================

  test:

    name: Test & Coverage

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |

          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage
        id: coverage
        run: |

          python - <<'EOF'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse(
            "reports/coverage.xml"
          ).getroot()

          pct = round(
            float(
              root.attrib.get(
                "line-rate",
                0
              )
            ) * 100,
            2
          )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

              f.write(f"pct={pct}\n")

          print(f"Coverage: {pct}%")
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

# ============================================================
# LINT
# ============================================================

  lint:

    name: Lint

    runs-on: ubuntu-latest

    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        id: run
        run: |

          mkdir -p reports

          if ruff check . \
            --line-length 120 \
            --output-format=github; then

            echo "status=passed" >> "$GITHUB_OUTPUT"

          else

            echo "status=warning" >> "$GITHUB_OUTPUT"

          fi

          ruff check . \
            --line-length 120 \
            --output-format=text \
            > reports/lint-report.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: reports/lint-report.txt

# ============================================================
# SECURITY
# ============================================================

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        id: run
        run: |

          mkdir -p reports

          bandit -r app/ \
            -f json \
            -o reports/bandit-report.json || true

          bandit -r app/ \
            -f html \
            -o reports/bandit-report.html || true

          HIGH=$(python - <<'EOF'
          import json

          data = json.load(
            open(
              "reports/bandit-report.json"
            )
          )

          high = [
            i for i in data.get(
              "results",
              []
            )

            if i.get(
              "issue_severity"
            ) == "HIGH"
          ]

          print(len(high))
          EOF
          )

          TOTAL=$(python - <<'EOF'
          import json

          data = json.load(
            open(
              "reports/bandit-report.json"
            )
          )

          print(
            len(
              data.get(
                "results",
                []
              )
            )
          )
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then

            echo "status=failed" >> "$GITHUB_OUTPUT"

          elif [ "$TOTAL" -gt "0" ]; then

            echo "status=warning" >> "$GITHUB_OUTPUT"

          else

            echo "status=passed" >> "$GITHUB_OUTPUT"

          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/bandit-report.*

# ============================================================
# DEPENDENCY SCAN
# ============================================================

  dependency-scan:

    name: Dependency Scan

    runs-on: ubuntu-latest

    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        id: run
        run: |

          mkdir -p reports

          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/dependency-report.json || true

          python - <<'EOF'

          import json
          import os

          data = json.load(
            open(
              "reports/dependency-report.json"
            )
          )

          vulns = sum(
            len(dep.get("vulns", []))
            for dep in data.get(
              "dependencies",
              []
            )
          )

          status = (
            "passed"
            if vulns == 0
            else "warning"
          )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

              f.write(f"status={status}\n")
              f.write(f"vuln_count={vulns}\n")

          print("Vulnerabilities:", vulns)

          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports/dependency-report.json

# ============================================================
# DASHBOARD
# ============================================================

  dashboard:

    name: Publish Dashboard

    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site/test-report

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: site/lint-report

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: site/security-report

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: site/dependency-report

# ============================================================
# STATUS JSON
# ============================================================

      - name: Build status.json
        run: |

          mkdir -p site

          cat > site/status.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",

            "coverage": ${{ needs.test.outputs.coverage || 0 }},

            "tests": "passed",

            "lint": "${{ needs.lint.outputs.status }}",

            "security": "${{ needs.security.outputs.status }}",

            "dependency": "${{ needs.dependency-scan.outputs.status }}",

            "vuln_count":
              ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

# ============================================================
# DASHBOARD HTML
# ============================================================

      - name: Generate Premium Dashboard
        run: |

          cat > site/index.html <<'EOF'

          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          />

          <title>
            FastAPI Premium Dashboard
          </title>

          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

          <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
          />

          <style>

          :root{
            --bg:#020617;
            --card:#0f172a;
            --border:#1e293b;
            --text:#f8fafc;
            --muted:#94a3b8;
            --green:#22c55e;
            --amber:#f59e0b;
            --blue:#2563eb;
          }

          *{
            margin:0;
            padding:0;
            box-sizing:border-box;
          }

          body{
            font-family:'Inter',sans-serif;

            background:
            radial-gradient(circle at top right,#0ea5e920,transparent 25%),
            radial-gradient(circle at bottom left,#8b5cf620,transparent 25%),
            var(--bg);

            color:var(--text);
            overflow-x:hidden;
          }

          /* SIDEBAR */

          .sidebar{

            width:220px;

            position:fixed;

            top:0;
            left:0;
            bottom:0;

            background:rgba(2,6,23,.96);

            border-right:1px solid var(--border);

            padding:18px;
          }

          .logo{

            display:flex;
            align-items:center;
            gap:10px;

            font-size:22px;
            font-weight:900;

            margin-bottom:24px;
          }

          .logo span{
            color:#3b82f6;
          }

          .nav-item{

            display:flex;
            align-items:center;
            gap:12px;

            padding:12px 14px;

            border-radius:14px;

            margin-bottom:10px;

            background:linear-gradient(
              to right,
              #0f172a,
              #111827
            );

            border:1px solid #1e293b;

            font-size:14px;
            font-weight:600;
          }

          .section{
            margin-top:24px;
          }

          .section-title{

            color:#64748b;

            font-size:11px;

            letter-spacing:.16em;

            margin-bottom:12px;
          }

          .report{

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:12px 10px;

            border-radius:12px;

            margin-bottom:8px;

            text-decoration:none;

            color:white;

            font-size:13px;
          }

          .report:hover{
            background:#ffffff08;
          }

          .pill{

            padding:4px 10px;

            border-radius:999px;

            font-size:11px;
            font-weight:700;
          }

          .green{
            background:#14532d;
            color:#4ade80;
          }

          .blue{
            background:#172554;
            color:#60a5fa;
          }

          .amber{
            background:#78350f;
            color:#fbbf24;
          }

          .gray{
            background:#3f3f46;
            color:#facc15;
          }

          /* MAIN */

          .main{

            margin-left:220px;

            width:calc(100vw - 220px);

            padding:18px;
          }

          .top{

            display:flex;
            justify-content:space-between;
            align-items:flex-start;

            gap:20px;
          }

          .title{

            font-size:32px;
            font-weight:900;
          }

          .subtitle{

            margin-top:8px;

            color:var(--muted);

            font-size:13px;
          }

          .run{

            border:none;

            background:linear-gradient(
              to right,
              #2563eb,
              #3b82f6
            );

            color:white;

            padding:10px 18px;

            border-radius:12px;

            font-size:13px;
            font-weight:700;
          }

          /* HERO */

          .hero{

            margin-top:20px;

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:22px;

            padding:20px;
          }

          .health{

            display:inline-flex;
            align-items:center;
            gap:8px;

            background:#052e16;

            color:#4ade80;

            padding:8px 14px;

            border-radius:999px;

            font-size:13px;
            font-weight:700;
          }

          .hero-text{

            margin-top:18px;

            max-width:650px;

            line-height:1.7;

            color:#cbd5e1;

            font-size:14px;
          }

          /* PIPELINE */

          .pipeline{

            margin-top:24px;

            display:flex;
            align-items:center;

            gap:12px;

            overflow-x:auto;

            padding-bottom:10px;
          }

          .stage{

            min-width:135px;

            background:#0b1220;

            border:1px solid #1e293b;

            border-radius:18px;

            padding:16px;

            text-align:center;
          }

          .stage.success{
            border-color:#14532d;
          }

          .stage.warning{
            border-color:#78350f;
          }

          .icon{

            width:40px;
            height:40px;

            border-radius:50%;

            display:flex;
            align-items:center;
            justify-content:center;

            margin:auto;

            font-size:18px;
            font-weight:900;
          }

          .success .icon{
            background:#14532d;
            color:#4ade80;
          }

          .warning .icon{
            background:#78350f;
            color:#fbbf24;
          }

          .stage-name{

            margin-top:12px;

            font-size:16px;
            font-weight:800;
          }

          .stage-status{

            margin-top:6px;

            font-size:13px;
          }

          .stage-time{

            margin-top:6px;

            color:#94a3b8;

            font-size:11px;
          }

          .connector{

            min-width:40px;

            display:flex;
            justify-content:center;

            gap:4px;
          }

          .connector div{

            width:8px;
            height:8px;

            border-radius:50%;

            background:#22c55e;
          }

          .connector.warn div{
            background:#fbbf24;
          }

          /* METRICS */

          .metrics{

            margin-top:18px;

            display:grid;

            grid-template-columns:
            repeat(5,1fr);

            gap:12px;
          }

          .metric{

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:18px;

            padding:16px;
          }

          .metric-title{
            font-size:13px;
          }

          .metric-value{

            margin-top:14px;

            font-size:28px;
            font-weight:900;
          }

          .metric-sub{

            margin-top:8px;

            color:#cbd5e1;

            font-size:12px;
          }

          .metric-progress{

            margin-top:12px;

            height:6px;

            background:#1e293b;

            border-radius:999px;

            overflow:hidden;
          }

          .metric-fill{

            height:100%;

            background:linear-gradient(
              to right,
              #22c55e,
              #4ade80
            );

            width:80%;
          }

          /* BOTTOM */

          .bottom{

            margin-top:18px;

            display:grid;

            grid-template-columns:
            1.2fr 1fr 1fr;

            gap:16px;
          }

          .panel{

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:20px;

            padding:18px;
          }

          .panel-title{

            font-size:20px;
            font-weight:800;

            margin-bottom:18px;
          }

          /* ACTIVITY */

          .timeline{
            display:flex;
            flex-direction:column;
            gap:18px;
          }

          .event{
            display:flex;
            gap:12px;
          }

          .event-dot{

            width:12px;
            height:12px;

            border-radius:50%;

            margin-top:4px;

            background:#22c55e;
          }

          .event-time{

            color:#94a3b8;

            font-size:11px;

            margin-bottom:4px;
          }

          .event-title{

            font-size:15px;
            font-weight:700;
          }

          .event-desc{

            margin-top:4px;

            color:#cbd5e1;

            font-size:12px;
          }

          /* RESPONSIVE */

          @media(max-width:1600px){

            .metrics{
              grid-template-columns:repeat(2,1fr);
            }

            .bottom{
              grid-template-columns:1fr;
            }
          }

          @media(max-width:1200px){

            .sidebar{
              position:relative;
              width:100%;
            }

            .main{
              margin-left:0;
              width:100%;
            }
          }

          @media(max-width:700px){

            .metrics{
              grid-template-columns:1fr;
            }

            .pipeline{
              flex-direction:column;
              align-items:stretch;
            }

            .connector{
              display:none;
            }
          }

          </style>

          </head>

          <body>

          <div class="sidebar">

            <div class="logo">
              🚀 <span>FastAPI</span>
            </div>

            <div class="nav-item">
              📊 Overview
            </div>

            <div class="section">

              <div class="section-title">
                REPORTS
              </div>

              <a
                class="report"
                href="test-report/test-report.html"
                target="_blank"
              >
                <span>✅ Test Results</span>
                <div class="pill green">
                  pass
                </div>
              </a>

              <a
                class="report"
                href="test-report/htmlcov/index.html"
                target="_blank"
              >
                <span>📈 Coverage HTML</span>
                <div class="pill blue">
                  80%
                </div>
              </a>

              <a
                class="report"
                href="lint-report/lint-report.txt"
                target="_blank"
              >
                <span>📄 Lint Report</span>
                <div class="pill amber">
                  warn
                </div>
              </a>

              <a
                class="report"
                href="security-report/bandit-report.html"
                target="_blank"
              >
                <span>🛡 Security Report</span>
                <div class="pill amber">
                  warn
                </div>
              </a>

              <a
                class="report"
                href="dependency-report/dependency-report.json"
                target="_blank"
              >
                <span>📦 Dependency Scan</span>
                <div class="pill gray">
                  35
                </div>
              </a>

            </div>

          </div>

          <div class="main">

            <div class="top">

              <div>

                <div class="title">
                  FastAPI pipeline dashboard
                </div>

                <div class="subtitle">
                  Commit 2833df5 • main • 11 May 2026
                </div>

              </div>

              <button class="run">
                ▶ Run #290730
              </button>

            </div>

            <div class="hero">

              <div class="health">
                🟢 Pipeline Healthy
              </div>

              <div class="hero-text">
                Real-time CI/CD visibility with testing,
                coverage analysis, security scanning,
                dependency monitoring and deployment insights.
              </div>

              <!-- PIPELINE STAGES -->

              <div class="pipeline">

                <div class="stage success">
                  <div class="icon">✓</div>
                  <div class="stage-name">Checkout</div>
                  <div class="stage-status">Completed</div>
                  <div class="stage-time">11:05:24</div>
                </div>

                <div class="connector">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage success">
                  <div class="icon">✓</div>
                  <div class="stage-name">Tests</div>
                  <div class="stage-status">Passed</div>
                  <div class="stage-time">11:06:02</div>
                </div>

                <div class="connector">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage success">
                  <div class="icon">✓</div>
                  <div class="stage-name">Coverage</div>
                  <div class="stage-status">80.4%</div>
                  <div class="stage-time">11:06:25</div>
                </div>

                <div class="connector warn">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage warning">
                  <div class="icon">⚠</div>
                  <div class="stage-name">Lint</div>
                  <div class="stage-status">Warning</div>
                  <div class="stage-time">11:07:12</div>
                </div>

                <div class="connector warn">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage warning">
                  <div class="icon">⚠</div>
                  <div class="stage-name">Security</div>
                  <div class="stage-status">Warning</div>
                  <div class="stage-time">11:07:58</div>
                </div>

                <div class="connector warn">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage warning">
                  <div class="icon">⚠</div>
                  <div class="stage-name">Dependencies</div>
                  <div class="stage-status">35 vulns</div>
                  <div class="stage-time">11:09:32</div>
                </div>

              </div>

            </div>

          </div>

          </body>
          </html>

          EOF

# ============================================================
# NO JEKYLL
# ============================================================

      - name: Disable Jekyll
        run: touch site/.nojekyll

# ============================================================
# DEPLOY
# ============================================================

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true