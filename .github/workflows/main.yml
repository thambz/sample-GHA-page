          EOF

      # ============================================
      # DISABLE JEKYLL
      # ============================================

      - name: Disable Jekyll
        run: touch site/.nojekyll

      # ============================================
      # DEPLOY GITHUB PAGES
      # ============================================

      - name: Deploy dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

# ============================================================
# BUILD & PUSH DOCKER IMAGE
# ============================================================

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:

      - uses: actions/checkout@v4

      # ============================================
      # AZURE LOGIN
      # ============================================

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:
            ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id:
            ${{ secrets.AZURE_TENANT_ID }}

          subscription-id:
            ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ============================================
      # LOGIN ACR
      # ============================================

      - name: Login to ACR
        run: |
          az acr login \
            --name ${{ secrets.ACR_NAME }}

      # ============================================
      # IMAGE TAGS
      # ============================================

      - name: Set image tags
        run: |
          REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"

          echo "IMAGE_SHA=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_ENV"

          echo "IMAGE_LATEST=${REGISTRY}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_ENV"

          echo "CACHE_REF=${REGISTRY}/${{ env.IMAGE_NAME }}:cache" >> "$GITHUB_ENV"

      # ============================================
      # DOCKER BUILDX
      # ============================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # BUILD & PUSH
      # ============================================

      - name: Build and push image
        run: |
          docker buildx build \
            --cache-from type=registry,ref=${{ env.CACHE_REF }} \
            --cache-to type=registry,ref=${{ env.CACHE_REF }},mode=max \
            --tag ${{ env.IMAGE_SHA }} \
            --tag ${{ env.IMAGE_LATEST }} \
            --push \
            .

      # ============================================
      # SUMMARY
      # ============================================

      - name: Build summary
        run: |
          echo "## Docker Image Pushed" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "- SHA Tag: \`${{ env.IMAGE_SHA }}\`" >> $GITHUB_STEP_SUMMARY

          echo "- Latest Tag: \`${{ env.IMAGE_LATEST }}\`" >> $GITHUB_STEP_SUMMARY

          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY