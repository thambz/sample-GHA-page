# ============================================================
#  FastAPI — Production CI/CD Pipeline
#  Target: Azure Container Registry (ACR)
#
#  SECRETS needed in GitHub → Settings → Secrets:
#    AZURE_CLIENT_ID        (OIDC federated credential)
#    AZURE_TENANT_ID
#    AZURE_SUBSCRIPTION_ID
#    ACR_NAME               (e.g. "myregistry" — no .azurecr.io)
#
#  HOW TO SET UP OIDC (no static keys):
#    az ad app create --display-name "github-actions-oidc"
#    az ad sp create --id <app-id>
#    az role assignment create --role AcrPush \
#      --assignee <sp-object-id> \
#      --scope /subscriptions/.../resourceGroups/.../providers/Microsoft.ContainerRegistry/registries/<ACR_NAME>
#    Add federated credential: issuer=https://token.actions.githubusercontent.com
#      subject=repo:<org>/<repo>:ref:refs/heads/main
# ============================================================

name: FastAPI Production CI/CD

# ── Triggers ─────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── Global env ───────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: fastapi-app
  # Full image name built dynamically in build job

# ── Concurrency: cancel in-flight runs on same branch/PR ─────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================
jobs:

# ─────────────────────────────────────────────────────────────
# JOB 1 — test
#   Runs pytest with coverage. Fails pipeline if < 80%.
#   Uploads HTML + XML reports as artifact.
# ─────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}   # e.g. "87.45"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |
          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      # Extract coverage % and expose as job output
      - name: Extract coverage percentage
        id: coverage
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os
          root = ET.parse("reports/coverage.xml").getroot()
          pct = round(float(root.attrib.get("line-rate", 0)) * 100, 2)
          print(f"Coverage: {pct}%")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pct={pct}\n")
          EOF

      - name: Upload test reports
        if: always()                          # upload even on test failure
        uses: actions/upload-artifact@v4  # v4.6.0
        with:
          name: test-reports
          path: reports/
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 2a — lint   (parallel with security + deps after test)
#   Uses ruff — 10-100x faster than flake8.
#   WARNING on violations; does NOT fail the pipeline.
#   Fails only if ruff itself crashes (config error, etc.).
# ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}   # "passed" | "warning"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        id: run
        run: |
          # --output-format=github → inline PR annotations
          if ruff check . --output-format=github --line-length 120; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Lint issues found — see annotations above"
          fi

          # Also generate a text report for the dashboard
          ruff check . --line-length 120 --output-format=text > reports/lint-report.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: reports/lint-report.txt
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 2b — security   (parallel with lint + deps after test)
#   bandit scans for Python security issues.
#   HIGH severity issues → fail the pipeline (blocks deploy).
#   MEDIUM/LOW → warning only.
# ─────────────────────────────────────────────────────────────
  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        id: run
        run: |
          mkdir -p reports

          # Full report for artifact
          bandit -r app/ -f json -o reports/bandit-report.json || true
          bandit -r app/ -f html -o reports/bandit-report.html || true

          # Fail pipeline on HIGH severity issues; warn on others
          HIGH=$(python - <<'EOF'
          import json, sys
          data = json.load(open("reports/bandit-report.json"))
          high = [i for i in data.get("results", []) if i.get("issue_severity") == "HIGH"]
          print(len(high))
          EOF
          )

          if [ "$HIGH" -gt "0" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::$HIGH HIGH-severity security issue(s) found. Pipeline blocked."
            exit 1
          fi

          TOTAL=$(python -c "import json; d=json.load(open('reports/bandit-report.json')); print(len(d.get('results', [])))")
          if [ "$TOTAL" -gt "0" ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::$TOTAL medium/low security issue(s). Review bandit report."
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/bandit-report.*
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 2c — dependency-scan   (parallel with lint + security)
#   pip-audit checks for known CVEs in requirements.txt.
#   Any vulnerability → warning (not a hard fail by default).
#   Change exit 0 → exit 1 below to make it a hard fail.
# ─────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    needs: test

    outputs:
      status: ${{ steps.run.outputs.status }}
      vuln_count: ${{ steps.run.outputs.vuln_count }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        id: run
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/dependency-report.json || true

          python - <<'EOF'
          import json, os

          data = json.load(open("reports/dependency-report.json"))
          vulns = sum(len(d.get("vulns", [])) for d in data.get("dependencies", []))

          status = "passed" if vulns == 0 else "warning"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\n")
              f.write(f"vuln_count={vulns}\n")

          if vulns > 0:
              print(f"::warning::{vulns} vulnerable dependency/dependencies found.")

          # Generate readable HTML report
          rows = ""
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  rows += f"<tr><td>{dep.get('name')}</td><td>{dep.get('version')}</td><td>{v.get('id')}</td><td>{v.get('description','')[:120]}</td></tr>"
          if not rows:
              rows = "<tr><td colspan='4' style='color:green'>No vulnerabilities found</td></tr>"

          html = f"""<!DOCTYPE html><html><head><title>Dependency Scan</title>
          <style>body{{font-family:sans-serif;padding:1rem}}table{{border-collapse:collapse;width:100%}}
          th,td{{border:1px solid #ccc;padding:6px 10px;text-align:left}}th{{background:#f4f4f4}}</style></head>
          <body><h2>Dependency Scan (pip-audit)</h2>
          <table><tr><th>Package</th><th>Version</th><th>CVE</th><th>Description</th></tr>{rows}</table></body></html>"""

          open("reports/dependency-report.html", "w").write(html)
          print(f"Done. Vulnerabilities: {vulns}")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports/dependency-report.*
          retention-days: 14


# ─────────────────────────────────────────────────────────────
# JOB 3 — dashboard
#   Runs only on main branch (not PRs).
#   Assembles all reports + a summary index.html →
#   deploys to GitHub Pages.
# ─────────────────────────────────────────────────────────────
  dashboard:
    name: Publish dashboard (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [lint, security, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write   # needed by peaceiris/actions-gh-pages

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Download all reports into separate directories
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: test-reports,       path: site/test-report }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: lint-report,        path: site/lint-report }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: security-report,    path: site/security-report }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: dependency-report,  path: site/dependency-report }

      # Build status.json from job outputs (proper approach — no artifact passing)
      - name: Build status.json
        run: |
          cat > site/status.json <<EOF
          {
            "commit":     "${{ github.sha }}",
            "branch":     "${{ github.ref_name }}",
            "run_id":     "${{ github.run_id }}",
            "timestamp":  "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "coverage":   ${{ needs.test.outputs.coverage || 0 }},
            "tests":      "passed",
            "lint":       "${{ needs.lint.outputs.status }}",
            "security":   "${{ needs.security.outputs.status }}",
            "dependency": "${{ needs.dependency-scan.outputs.status }}",
            "vuln_count": ${{ needs.dependency-scan.outputs.vuln_count || 0 }}
          }
          EOF

      # Generate the dashboard index.html inline (no extra file needed in repo)
      - name: Generate dashboard HTML
        run: |
          cat > site/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FastAPI pipeline dashboard</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                     background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 2rem; }
              .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px;
                       font-weight: 500; padding: 4px 10px; border-radius: 20px; width: fit-content; }
              .badge::before { content: ""; display: inline-block; width: 7px; height: 7px;
                               border-radius: 50%; flex-shrink: 0; }
              .s-passed  { background: #1a4731; color: #3fb950; }
              .s-passed::before  { background: #3fb950; }
              .s-warning { background: #3d2b00; color: #d29922; }
              .s-warning::before { background: #d29922; }
              .s-failed  { background: #4a1818; color: #f85149; }
              .s-failed::before  { background: #f85149; }
              .s-unknown { background: #21262d; color: #8b949e; }
              .s-unknown::before { background: #8b949e; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                      gap: 10px; margin-bottom: 1.5rem; }
              .card { background: #161b22; border: 0.5px solid #30363d; border-radius: 12px;
                      padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
              .card-label { font-size: 11px; font-weight: 500; letter-spacing: .05em;
                            color: #8b949e; text-transform: uppercase; margin: 0; }
              .cov-num { font-size: 28px; font-weight: 500; line-height: 1; }
              .cov-track { height: 5px; background: #30363d; border-radius: 4px; overflow: hidden; }
              .cov-fill  { height: 100%; border-radius: 4px; transition: width .6s ease; }
              .divider { height: 0.5px; background: #30363d; margin: 1rem 0; }
              .links { display: flex; flex-wrap: wrap; gap: 8px; }
              .rlink { font-size: 12px; color: #58a6ff; background: #161b22;
                       border: 0.5px solid #30363d; border-radius: 8px;
                       padding: 5px 12px; text-decoration: none; }
              .rlink:hover { background: #1c2128; }
              .section-label { font-size: 11px; font-weight: 500; letter-spacing: .05em;
                                color: #8b949e; text-transform: uppercase; margin: 0 0 10px; }
            </style>
          </head>
          <body>

            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:0.25rem;">
              <div>
                <p style="font-size:20px;font-weight:500;margin:0;">FastAPI pipeline dashboard</p>
                <p style="font-size:12px;color:#8b949e;margin:4px 0 0;" id="meta-line">Loading...</p>
              </div>
              <span style="font-size:12px;background:#161b22;border:0.5px solid #30363d;border-radius:8px;padding:3px 10px;color:#e6edf3;" id="run-badge">—</span>
            </div>

            <div class="divider"></div>

            <div class="grid">
              <div class="card">
                <p class="card-label">Tests</p>
                <span class="badge" id="b-tests">—</span>
              </div>
              <div class="card">
                <p class="card-label">Coverage</p>
                <span class="cov-num" id="cov-pct">—</span>
                <div class="cov-track"><div class="cov-fill" id="cov-bar" style="width:0%"></div></div>
              </div>
              <div class="card">
                <p class="card-label">Lint</p>
                <span class="badge" id="b-lint">—</span>
              </div>
              <div class="card">
                <p class="card-label">Security</p>
                <span class="badge" id="b-sec">—</span>
              </div>
              <div class="card">
                <p class="card-label">Dependencies</p>
                <span class="badge" id="b-dep">—</span>
                <span style="font-size:11px;color:#8b949e;" id="dep-sub"></span>
              </div>
            </div>

            <p class="section-label">Reports</p>
            <div class="links">
              <a class="rlink" href="test-report/test-report.html">Test results</a>
              <a class="rlink" href="test-report/htmlcov/index.html">Coverage HTML</a>
              <a class="rlink" href="lint-report/lint-report.txt">Lint</a>
              <a class="rlink" href="security-report/bandit-report.html">Security</a>
              <a class="rlink" href="dependency-report/dependency-report.html">Dependencies</a>
            </div>

            <div class="divider"></div>
            <p style="font-size:11px;color:#8b949e;margin:0;" id="footer-ts">—</p>

            <script>
              function setBadge(id, s) {
                const el = document.getElementById(id);
                const c = s==="passed"?"s-passed":s==="warning"?"s-warning":s==="failed"?"s-failed":"s-unknown";
                el.className = "badge " + c;
                el.textContent = s || "unknown";
              }
              fetch("status.json").then(r=>r.json()).then(d => {
                document.getElementById("meta-line").textContent =
                  "Commit " + (d.commit||"").slice(0,7) + " · " + d.branch + " · " + (d.timestamp||"").replace("T"," ").replace("Z"," UTC");
                document.getElementById("run-badge").textContent = "Run #" + (d.run_id||"").slice(-6);
                setBadge("b-tests", d.tests);
                setBadge("b-lint",  d.lint);
                setBadge("b-sec",   d.security);
                setBadge("b-dep",   d.dependency);
                const cov = parseFloat(d.coverage)||0;
                document.getElementById("cov-pct").textContent = cov.toFixed(1) + "%";
                const bar = document.getElementById("cov-bar");
                bar.style.width = Math.min(cov,100) + "%";
                bar.style.background = cov>=80?"#3fb950":cov>=60?"#d29922":"#f85149";
                if (d.vuln_count > 0)
                  document.getElementById("dep-sub").textContent = d.vuln_count + " vuln(s) found";
                const ts = new Date(d.timestamp);
                document.getElementById("footer-ts").textContent =
                  "Generated " + ts.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"}) + " IST";
              });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Touch .nojekyll
        run: touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true


# ─────────────────────────────────────────────────────────────
# JOB 4 — build-and-push
#   Runs ONLY on main branch after all checks pass.
#   Uses OIDC (no stored credentials).
#   Tags image with commit SHA + "latest".
#   Docker layer cache via ACR — faster rebuilds.
# ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push to ACR
    runs-on: ubuntu-latest
    needs: [lint, security, dependency-scan]
    # Only deploy from main; skip on PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      id-token: write   # OIDC token
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login (OIDC — no static credentials)
        uses: azure/login@a457da9ea143d694b1b9c7c5e5c89f19f8e44e24  # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set image tags
        run: |
          REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"
          echo "IMAGE_SHA=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}"  >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${REGISTRY}/${{ env.IMAGE_NAME }}:latest"          >> "$GITHUB_ENV"
          echo "CACHE_REF=${REGISTRY}/${{ env.IMAGE_NAME }}:cache"              >> "$GITHUB_ENV"

      # BuildKit inline cache — reuse layers from previous builds
      - name: Build image (with layer cache)
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from  type=registry,ref=${{ env.CACHE_REF }} \
            --cache-to    type=registry,ref=${{ env.CACHE_REF }},mode=max \
            --tag ${{ env.IMAGE_SHA }} \
            --tag ${{ env.IMAGE_LATEST }} \
            --push \
            .

      - name: Summary
        run: |
          echo "### Docker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA tag:** \`${{ env.IMAGE_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest:**  \`${{ env.IMAGE_LATEST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:**  \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"