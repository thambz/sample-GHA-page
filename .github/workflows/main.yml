# ============================================================
# FastAPI Production CI/CD Pipeline
# Premium Observability Dashboard
# ============================================================

name: FastAPI Production CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

# ============================================================
# TEST
# ============================================================

  test:

    name: Test & Coverage

    runs-on: ubuntu-latest

    outputs:
      coverage: ${{ steps.coverage.outputs.value }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |

          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage
        id: coverage
        run: |

          python <<EOF
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse(
            "reports/coverage.xml"
          ).getroot()

          pct = round(
            float(
              root.attrib.get(
                "line-rate",
                0
              )
            ) * 100,
            2
          )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

            f.write(
              f"value={pct}\n"
            )

          EOF

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

# ============================================================
# LINT
# ============================================================

  lint:

    name: Lint

    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.result.outputs.value }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: |

          mkdir -p reports

          ruff check . \
            > reports/lint-report.txt \
            2>&1 || true

      - name: Lint status
        id: result
        run: |

          if grep -q "error" reports/lint-report.txt; then

            echo "value=warning" >> $GITHUB_OUTPUT

          else

            echo "value=passed" >> $GITHUB_OUTPUT

          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/lint-report.txt

# ============================================================
# SECURITY
# ============================================================

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.result.outputs.value }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |

          mkdir -p reports

          bandit -r app \
            -f json \
            -o reports/bandit-report.json || true

      - name: Security status
        id: result
        run: |

          COUNT=$(python <<EOF
          import json

          data=json.load(
            open(
              "reports/bandit-report.json"
            )
          )

          print(
            len(
              data.get(
                "results",
                []
              )
            )
          )
          EOF
          )

          if [ "$COUNT" -gt "0" ]; then

            echo "value=warning" >> $GITHUB_OUTPUT

          else

            echo "value=passed" >> $GITHUB_OUTPUT

          fi

      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/bandit-report.json

# ============================================================
# DEPENDENCY SCAN
# ============================================================

  dependency-scan:

    name: Dependency Scan

    runs-on: ubuntu-latest

    outputs:
      vulns: ${{ steps.vuln.outputs.count }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run dependency scan
        run: |

          mkdir -p reports

          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/dependency-report.json || true

      - name: Count vulns
        id: vuln
        run: |

          python <<EOF

          import json
          import os

          data=json.load(
            open(
              "reports/dependency-report.json"
            )
          )

          total=0

          for d in data.get(
            "dependencies",
            []
          ):

            total += len(
              d.get(
                "vulns",
                []
              )
            )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

            f.write(
              f"count={total}\n"
            )

          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports/dependency-report.json

# ============================================================
# DASHBOARD
# ============================================================

  dashboard:

    name: Publish Dashboard

    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site/test-report

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: site/lint-report

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: site/security-report

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: site/dependency-report

# ============================================================
# GENERATE DASHBOARD
# ============================================================

