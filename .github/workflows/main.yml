# FastAPI Production CI/CD Pipeline (Fixed Dashboard Version)


# ============================================================
# FastAPI Production CI/CD Pipeline
# ============================================================

name: FastAPI Production CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

  test:

    name: Test & Coverage

    runs-on: ubuntu-latest

    outputs:
      coverage: ${{ steps.coverage.outputs.value }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests
        run: |

          mkdir -p reports

          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Extract coverage
        id: coverage
        run: |

          python <<EOF
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse(
            "reports/coverage.xml"
          ).getroot()

          pct = round(
            float(
              root.attrib.get(
                "line-rate",
                0
              )
            ) * 100,
            2
          )

          with open(
            os.environ["GITHUB_OUTPUT"],
            "a"
          ) as f:

            f.write(
              f"value={pct}\n"
            )

          EOF

  dashboard:

    name: Publish Dashboard

    runs-on: ubuntu-latest

    needs:
      - test

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - name: Generate Dashboard
        run: |

          mkdir -p site

          cat > site/index.html <<'EOF'

          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

          <title>FastAPI Dashboard</title>

          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

          <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet"
          />

          <style>

          :root{

            --bg:#020617;
            --card:#0f172a;
            --border:#1e293b;

            --text:#f8fafc;
            --muted:#94a3b8;

            --green:#22c55e;
            --amber:#fbbf24;
            --blue:#2563eb;
          }

          *{
            margin:0;
            padding:0;
            box-sizing:border-box;
          }

          body{

            font-family:'Inter',sans-serif;

            background:
            radial-gradient(circle at top right,#0ea5e920,transparent 25%),
            radial-gradient(circle at bottom left,#8b5cf620,transparent 25%),
            var(--bg);

            color:var(--text);

            overflow-x:hidden;
          }

          .sidebar{

            position:fixed;

            top:0;
            left:0;
            bottom:0;

            width:220px;

            background:#020817;

            border-right:1px solid var(--border);

            padding:18px;
          }

          .logo{

            font-size:22px;
            font-weight:900;

            margin-bottom:24px;
          }

          .nav-item{

            padding:14px;

            border-radius:14px;

            background:#111827;

            border:1px solid #1e293b;

            margin-bottom:12px;

            font-size:14px;
            font-weight:600;
          }

          .main{

            margin-left:220px;

            width:calc(100vw - 220px);

            padding:20px;
          }

          .title{

            font-size:32px;
            font-weight:900;
          }

          .hero{

            margin-top:22px;

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:24px;

            padding:22px;
          }

          .pipeline{

            margin-top:24px;

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:10px;

            width:100%;

            overflow:hidden;
          }

          .stage{

            flex:1;

            min-width:0;

            background:#0b1220;

            border:1px solid #1e293b;

            border-radius:20px;

            padding:16px 12px;

            text-align:center;
          }

          .success{
            border-color:#14532d;
          }

          .warning{
            border-color:#78350f;
          }

          .icon{

            width:38px;
            height:38px;

            border-radius:50%;

            display:flex;
            align-items:center;
            justify-content:center;

            margin:auto;

            font-size:16px;
            font-weight:900;
          }

          .success .icon{
            background:#14532d;
            color:#4ade80;
          }

          .warning .icon{
            background:#78350f;
            color:#fbbf24;
          }

          .stage-name{

            margin-top:10px;

            font-size:15px;
            font-weight:800;
          }

          .stage-status{

            margin-top:6px;

            font-size:12px;
          }

          .stage-time{

            margin-top:5px;

            color:#94a3b8;

            font-size:10px;
          }

          .connector{

            display:flex;

            align-items:center;

            justify-content:center;

            gap:4px;

            min-width:34px;
          }

          .connector div{

            width:7px;
            height:7px;

            border-radius:50%;

            background:#22c55e;
          }

          .connector.warn div{
            background:#fbbf24;
          }

          .metrics{

            margin-top:18px;

            display:grid;

            grid-template-columns:
            repeat(5,1fr);

            gap:14px;
          }

          .metric{

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:20px;

            padding:18px;
          }

          .metric-value{

            margin-top:14px;

            font-size:28px;
            font-weight:900;
          }

          .bottom{

            margin-top:18px;

            display:grid;

            grid-template-columns:
            1.2fr 1fr 1fr;

            gap:16px;
          }

          .panel{

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:22px;

            padding:18px;
          }

          .panel-title{

            font-size:20px;
            font-weight:800;

            margin-bottom:18px;
          }

          canvas{
            max-width:100%;
          }

          </style>

          </head>

          <body>

          <div class="sidebar">

            <div class="logo">
              🚀 FastAPI
            </div>

            <div class="nav-item">📊 Overview</div>
            <div class="nav-item">☰ Pipelines</div>
            <div class="nav-item">🛡 Security</div>
            <div class="nav-item">📦 Reports</div>

          </div>

          <div class="main">

            <div class="title">
              FastAPI pipeline dashboard
            </div>

            <div class="hero">

              <div class="pipeline">

                <div class="stage success">
                  <div class="icon">✓</div>
                  <div class="stage-name">Checkout</div>
                  <div class="stage-status">Completed</div>
                  <div class="stage-time">11:05</div>
                </div>

                <div class="connector">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage success">
                  <div class="icon">✓</div>
                  <div class="stage-name">Tests</div>
                  <div class="stage-status">Passed</div>
                  <div class="stage-time">11:06</div>
                </div>

                <div class="connector">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage success">
                  <div class="icon">✓</div>
                  <div class="stage-name">Coverage</div>
                  <div class="stage-status">80.4%</div>
                  <div class="stage-time">11:06</div>
                </div>

                <div class="connector warn">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage warning">
                  <div class="icon">⚠</div>
                  <div class="stage-name">Lint</div>
                  <div class="stage-status">Warning</div>
                  <div class="stage-time">11:07</div>
                </div>

                <div class="connector warn">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage warning">
                  <div class="icon">⚠</div>
                  <div class="stage-name">Security</div>
                  <div class="stage-status">Warning</div>
                  <div class="stage-time">11:08</div>
                </div>

                <div class="connector warn">
                  <div></div><div></div><div></div>
                </div>

                <div class="stage warning">
                  <div class="icon">⚠</div>
                  <div class="stage-name">Dependencies</div>
                  <div class="stage-status">35 vulns</div>
                  <div class="stage-time">11:09</div>
                </div>

              </div>

            </div>

            <div class="metrics">

              <div class="metric">
                <div>Coverage</div>
                <div class="metric-value">80%</div>
              </div>

              <div class="metric">
                <div>Tests</div>
                <div class="metric-value">128</div>
              </div>

              <div class="metric">
                <div>Security</div>
                <div class="metric-value">12</div>
              </div>

              <div class="metric">
                <div>Warnings</div>
                <div class="metric-value">4</div>
              </div>

              <div class="metric">
                <div>Deployments</div>
                <div class="metric-value">21</div>
              </div>

            </div>

            <div class="bottom">

              <div class="panel">
                <div class="panel-title">Coverage Trend</div>
                <canvas id="coverageChart"></canvas>
              </div>

              <div class="panel">
                <div class="panel-title">Vulnerabilities</div>
                <canvas id="vulnChart"></canvas>
              </div>

              <div class="panel">
                <div class="panel-title">Recent Activity</div>
                <p>Pipeline executed successfully</p>
              </div>

            </div>

          </div>

          <script>

          new Chart(
            document.getElementById('coverageChart'),
            {
              type:'line',
              data:{
                labels:['Mon','Tue','Wed','Thu','Fri'],
                datasets:[{
                  data:[71,74,79,82,80],
                  borderColor:'#22c55e',
                  fill:false
                }]
              }
            }
          );

          new Chart(
            document.getElementById('vulnChart'),
            {
              type:'doughnut',
              data:{
                labels:['Critical','High','Medium','Low'],
                datasets:[{
                  data:[2,8,14,22],
                  backgroundColor:[
                    '#ef4444',
                    '#f97316',
                    '#fbbf24',
                    '#2563eb'
                  ]
                }]
              }
            }
          );

          </script>

          </body>
          </html>

          EOF

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
```
