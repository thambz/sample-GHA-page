            font-weight:900;
          }

          .metric-progress{

            margin-top:12px;

            height:6px;

            background:#1e293b;

            border-radius:999px;

            overflow:hidden;
          }

          .metric-fill{

            width:80%;

            height:100%;

            background:linear-gradient(
              to right,
              #22c55e,
              #4ade80
            );
          }

          /* BOTTOM */

          .bottom{

            margin-top:18px;

            display:grid;

            grid-template-columns:
            1.2fr 1fr;

            gap:16px;
          }

          .panel{

            background:rgba(15,23,42,.72);

            border:1px solid var(--border);

            border-radius:20px;

            padding:18px;
          }

          .panel-title{

            font-size:20px;
