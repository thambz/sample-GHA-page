            border:1px solid var(--border);

            border-radius:24px;

            padding:24px;
          }

          .health{

            display:inline-flex;
            align-items:center;
            gap:8px;

            background:#052e16;

            color:#4ade80;

            padding:8px 14px;

            border-radius:999px;

            font-size:13px;
            font-weight:700;
          }

          .hero-title{

            margin-top:24px;

